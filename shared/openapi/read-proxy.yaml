        "503": { $ref: "#/components/responses/NotConfigured" }

  # ---------------------------------------------------------------------------
  # Fast load: one cold-load round trip, and a push channel (FASTLOAD_PLAN.md)
  # ---------------------------------------------------------------------------

  /bootstrap:
    get:
      tags: [ledger]
      summary: Every above-the-fold ledger value in one round trip — head, lastMintTime, k, kMax, floor.
      description: >
        Adds no cache key and no upstream call of its own: every field is read through the
        SAME key the individual `/ledger/*` route serves from, so a warm cache answers this
        in one round trip for zero upstream cost (ops/rate-limit-budget.md, pinned by
        test/budget.test.ts). What it removes is a WATERFALL — `k` is `getK(n, t)`, so a
        client cannot ask for it until it knows the head and the last mint time, which cost
        two to three sequential round trips before this route existed. `n` and `t` are
        resolved server-side and returned in `kArgs`, so the caller can place `k` in its own
        cache under the key it will later look up. `t` is bucketed by the one rule in
        `@ton-primes/shared/readSurface`.


        EVERY FIELD IS NULLABLE. One throttled or failed read must not take the
        other four down with it; a field that could not be resolved is `null` and its reason
        is named in `unavailable`. Callers are expected to keep their per-route polling as
        the fallback and the steady-state path — this route only decides when the FIRST value
        arrives.
      responses:
        "200":
          description: OK. Nullable fields are absent data, never a fabricated zero.
          content:
            application/json:
              schema:
                type: object
                properties:
                  head:
                    nullable: true
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          head: { type: string }
                      provenance: { $ref: "#/components/schemas/Provenance" }
                  lastMintTime:
                    nullable: true
                    description: Null when `getLastMintTime` could not be read.
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          lastMintTime: { type: string }
                      provenance: { $ref: "#/components/schemas/Provenance" }
                  k:
                    nullable: true
                    description: Null when there is no last-mint origin, so `t` is unknown.
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          k: { type: string }
                      provenance: { $ref: "#/components/schemas/Provenance" }
                  kMax:
                    nullable: true
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          kMax: { type: string }
                      provenance: { $ref: "#/components/schemas/Provenance" }
                  floor:
                    nullable: true
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          floorNumNanoton: { type: string }
                          floorDenPrimes: { type: string }
                      provenance: { $ref: "#/components/schemas/Provenance" }
                  kArgs:
                    nullable: true
                    description: The exact (n, t) `k` was read at.
                    type: object
                    properties:
                      n: { type: string }
                      t: { type: string }
                  unavailable:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string }
                        reason: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /events:
    get:
      tags: [ledger]
      summary: Server-Sent Events — a `mint` frame the moment a mint is indexed.
      description: >
        `text/event-stream`. On connect the server writes a `retry:` hint and a `: connected`
        comment, then a `: keepalive` comment every 25s so no intermediary closes the stream
        as idle. When the event-poller reports a newly indexed mint (over the Redis channel
        `primes:mint`), the proxy re-reads `getHead` and `getLastMintTime`, rewrites the cache
        entries the polled routes serve from, and emits one frame:


        `event: mint` with `data: {"n":"...","at":"...","bootstrap":{...}}`, where `bootstrap`
        is exactly the `/bootstrap` payload above.


        This route documents no 429: an upstream throttle during a push is logged and the
        frame is skipped — connected clients fall back to their polling, which
        FASTLOAD_PLAN.md retains explicitly — so a throttle never becomes a status code on
        this stream. Deployments must not buffer it (see the `location = /api/events` block in
        `ops/deploy/primes.live.conf`); a buffered SSE stream arrives batched, which is
        indistinguishable from this route not working.
      responses:
        "200":
          description: The stream. Stays open until the client disconnects.
          content:
            text/event-stream:
              schema: { type: string }
        "503":
          description: Too many open streams (`SSE_CAPACITY`). Poll instead.

  # ---------------------------------------------------------------------------
  # /ratchet/*
  # ---------------------------------------------------------------------------

  /ledger/ops-sweep:
    get:
      tags: [ledger]
      summary: What a permissionless `sweep_ops` would pay the ratchet pool right now (D-117).
      description: >
        Backed by `getOpsSweep` on the ledger: `sweepable` is the ledger's balance above every
        liability it holds plus `OPS_RESERVE`, net of the sweep's own gas. `sweep_ops` moves
        exactly that into the pool and raises `T` by it; at `0` the call is a no-op.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sweepableNanoton: { type: string }
                      opsReserveNanoton: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ledger/seed-t:
    get:
      tags: [ledger]
      summary: seedT — the `seeded` term of T = seeded + swapped + pending (D-26). 30s tier.
      description: >
        Backed by `getSeedT` on the ledger. DECISIONS.md D-26 / CONCEPT.md §5: `T` has
        THREE terms, not two. `seedT` is the founder capital genesis credits straight into
        `T`; it backs `S` from the DeDust LP and never passes through the ratchet's
        `pending`, so a two-term reading of the identity (`T == swapped + pending`) reports
        a permanent FALSE SOLVENCY GAP.

        A reader closes the identity with three get-calls across two contracts: this one,
        plus `/ratchet/swapped` and `/ratchet/pending`. The identity holds EXACTLY, as
        bigints. D-26 forbids closing the gap by any other route — do not net it, do not
        approximate it, and do not compute the missing term client-side.

        Its own key rather than a field on `/ledger/counters`, and the slow tier: `seedT`
        moves only at genesis and at D-91 point 4's permissionless `donate_floor` — a
        deliberate, rare operator action, not a per-mint quantity — while the counters move
        on every mint. Folding it into the 5s key would spend upstream budget forever to
        re-learn a number that changes a handful of times in a deployment's life. D-91
        point 5 retires the earlier claim that `seedT` is written once and never again;
        what is one-shot is GENESIS, not the field.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      seedTNanoton: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ledger/invite-terms:
    get:
      tags: [ledger]
      summary: §4.1's live invite terms — count and value, then the three fixed bounds (D-215). 30s tier.
      description: >
        Backed by `getInviteTerms` on the ledger, verbatim. `count` and `valueNanoton` are what
        the operator's `set_invite_terms` last wrote (genesis 3 × 0.1 GRAM); `sendFeeNanoton`,
        `lineCapNanoton` and `countCeiling` are `INVITE_SEND_FEE`, `INVITE_LINE_CAP` and
        `INVITE_COUNT_CEILING`, fixed in the contract. A mint declaring more than `count`
        invites is refused 221, so the checkout sizes its editor off this read, never off
        params.json (GAUNTLET.md E31). Slow tier: a changed count reaches clients within
        this TTL plus their own stale time.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      valueNanoton: { type: string }
                      sendFeeNanoton: { type: string }
                      lineCapNanoton: { type: string }
                      countCeiling: { type: integer }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ledger/era-leader:
    get:
      tags: [ledger]
      summary: The era trophy's live standing — leader and era-scoped recruit count (D-36). 30s tier.
      description: >
        Backed by `getEraLeader` on the ledger. DECISIONS.md D-36 / CONCEPT.md §4.7, §7: each
        primorial era runs a recruiting contest, and at the ceremony the ledger names the
        era's single highest recruiter, hands that wallet the NAMING RIGHT of the primorial
        itself, and resets every wallet's era-scoped count to zero.

        `leader` is `null` — never an empty string and never the zero address — when the
        chain returns `addr_none`, which is the honest "nobody has activated a recruit this
        era" reading. `recruits` is `"0"` beside it, and the pair means the ceremony will
        send no `award_era_trophy` and the boundary will be minted UNNAMED. A client must
        render that as its own state, not as a blank leader with a zero.

        D-106: a recruit counts on the RECRUIT EDGE — a §4.5 gift mint to an address the
        ledger has never seen — and ties go to whoever reached the count first (the running
        max moves on strict `>` only). Gifting the same wallet twice counts once.

        NOT the same contest as `recruitRank.recruits` on `/earn/{address}`, which is LIFETIME
        and never reset. A wallet's own ERA-SCOPED count is `eraRecruits`, also on
        `/earn/{address}`. A surface that shows one under the other's label shows the wrong
        contest.

        Its own route rather than a field on `/ledger/counters`: the pair moves on an
        activation edge, i.e. mint cadence at best, so the 30s tier is the honest cadence,
        and it is the era's GLOBAL standing rather than a per-wallet read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      leader:
                        type: string
                        nullable: true
                        description: >
                          Raw-form address, or `null` for `addr_none` — no activation this era.
                      recruits: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ratchet/pending:
    get:
      tags: [ratchet]
      summary: GRAM credited to the pool but not yet swapped (CONCEPT.md §4.3's `pending`).
      description: >
        Backed by `getPending` on the ratchet. Render this next to the floor WITH the reason
        it is there and with `T = swapped + pending` as the identity it is (UPGRADE_PLAN_V5.md
        §6 D3) — shown naked, the project's most auditable claim becomes its most
        suspicious-looking number.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pendingNanoton: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ratchet/swapped:
    get:
      tags: [ratchet]
      summary: Cumulative GRAM actually swapped and burned via flush() (CONCEPT.md §4.3/§5).
      description: Backed by `getSwapped` on the ratchet.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      swappedNanoton: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ratchet/flush-status:
    get:
      tags: [ratchet]
      summary: Last flush outcome — never / filled / bounced — with timestamp and cooldown.
      description: >
        Backed by `getFlushStatus`. CONCEPT.md §12 makes this non-optional: under the floor
        guard, "the venue is gone" and "the market is above the floor" look identical from
        outside without it, and a dead venue can hide behind months of legitimate-looking
        non-execution. `never` is a real state.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lastAttemptTime: { type: string, description: Unix seconds. }
                      outcome:
                        type: string
                        enum: [never, filled, bounced]
                      amountNanoton: { type: string }
                      cooldownRemainingSeconds: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ratchet/floor-cache:
    get:
      tags: [ratchet]
      summary: The (T, S) the FLOOR GUARD prices against — the ratchet's mirror, not the ledger's pair.
      description: >
        Backed by `getFloorCache` on the ratchet. **Not the same numbers as `/ledger/floor`.**
        The ledger's pair is authoritative and moves on every mint; the ratchet's is a mirror
        pushed with each `PoolInject`, and `computeMinOut` — the floor guard of CONCEPT.md
        §4.3.1 — reads the mirror. Anything previewing a flush or sizing a tranche must read
        THIS pair: previewing against the ledger's is previewing a guard the chain will not
        apply. The contract publishes the mirror separately for exactly that reason, so its
        staleness against the ledger is measurable rather than assumed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tCacheNanoton: { type: string, description: "`T` as the RATCHET last cached it." }
                      sCacheNanoPrimes: { type: string, description: "`S` from the same push." }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ratchet/staking:
    get:
      tags: [ratchet]
      summary: The staked reserve — `stakedCost`, `exiting`, the reserve target, the harvest clock and the realized loss.
      description: >
        Backed by `getStaking` on the ratchet. CONCEPT.md §4.3.2 / `DECISIONS.md` D-151: the
        ratchet's `pending` above a liquid reserve is deposited into the Tonstakers pool, held
        as tsTON and counted in `T` **at cost**, so `T = seeded + swapped + pending +
        stakedCost + exiting + realizedLoss`. All eight figures come from one get-method
        because they are read together: `pending + stakedCost + exiting` is the ratchet's
        whole obligation, `reserveTarget` is derived from that sum on every read and never
        stored, and a split assembled from several calls is a split whose parts do not sum to
        the total they are drawn against.


        `realizedLoss` is reported NEXT TO `stakedCost` and never netted into it. It is
        cumulative GRAM that left `T` and did not come back, and a non-zero value means `p_f`
        overstates the backing by exactly `realizedLoss / S` — §5's one external risk,
        published as a number rather than promised as an absence.


        `lastRateNum` / `lastRateDen` are the tsTON/GRAM rate as the PAIR it was learned as
        (off each `stake()`'s mint notification), so a reader checks the ratio rather than a
        quotient this service rounded. `lastHarvestTime` is `0` until the first harvest.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stakedCostNanoton: { type: string, description: GRAM in the pool, at cost. A term of `T`. }
                      tstonHeldNano: { type: string, description: nano-tsTON owned, excluding a tranche in the exit machine. }
                      exitingNanoton: { type: string, description: A tranche on its way back, at its cost basis. A term of `T`. }
                      lastRateNum: { type: string }
                      lastRateDen: { type: string }
                      reserveTargetNanoton: { type: string, description: Derived on chain from `pending + stakedCost + exiting`, never stored. }
                      lastHarvestTime: { type: string, description: Unix seconds; `0` before the first harvest. }
                      realizedLossNanoton: { type: string, description: Cumulative GRAM that left `T` and did not come back. }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ratchet/harvest-gates:
    get:
      tags: [ratchet]
      summary: The gates `harvest()` asserts that `/ratchet/staking` does not carry — interval, dust, exit leg.
      description: >
        Backed by `getStakingGates` and `getExitLeg` on the ratchet. `harvest()` refuses
        while an exit is open (230), before `harvestIntervalSec` has passed since
        `lastHarvestTime` (228), and when the accrued tsTON is under `harvestDustTston`
        (229). The interval is the one THIS deploy enforces, clock divisor included. The
        accrued yield itself is `tstonHeld − stakedCost · lastRateDen / lastRateNum`, from
        `/ratchet/staking`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      harvestIntervalSec: { type: integer }
                      harvestDustTston: { type: string, description: nano-tsTON. }
                      exitLeg: { type: integer, description: "`0` = no exit open." }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ratchet/identity:
    get:
      tags: [ratchet]
      summary: Every term of `T = seeded + swapped + pending + stakedCost + exiting + realizedLoss`, as ONE ordered snapshot.
      description: >
        Backed by `getFloorOracle` and `getStaking` on the ratchet, then `getFloorNum` and
        `getSeedT` on the ledger, in that order. The identity spans two contracts, and the ledger
        runs one message hop ahead. A mint raises `T`, then `PoolInject` raises `pending` and
        sets the mirror `tCache = T` in a later transaction. So the identity is checked as two
        exact claims: **ratchet-local** `tCache = seeded + swapped + pending + stakedCost +
        exiting + realizedLoss`, all read from one ratchet state, and **in flight** `T − tCache`.
        The second is GRAM the ledger has credited whose `PoolInject` has not landed yet. The
        ratchet is read first, so `T ≥ tCache`. A snapshot that does not close is re-read once
        and then served as it stands.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ledgerAddress: { type: string }
                      ratchetAddress: { type: string }
                      tNanoton: { type: string, description: "`T` from the ledger's `getFloorNum`, read last." }
                      seedTNanoton: { type: string, description: "`seeded`, the ledger's `getSeedT`." }
                      tCacheNanoton: { type: string, description: "`T` as the ratchet last received it, from `getFloorOracle`." }
                      sCacheNanoPrimes: { type: string, description: "`S` from the same push." }
                      pendingNanoton: { type: string, description: "From the same `getFloorOracle` call." }
                      swappedNanoton: { type: string, description: "From the same `getFloorOracle` call." }
                      staking: { type: object, description: "The `/ratchet/staking` object, from `getStaking`." }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /supply:
    get:
      tags: [ledger]
      summary: S, circulating supply, burns and vault payouts — as separate numbers, never netted.
      description: >
        CONCEPT.md §3.3 / §11.21 / §11.22. A bounty payout moves tokens into circulation
        without touching `S`; a burn removes tokens without touching `S`. Both change
        circulating supply in holders' favour, neither moves `p_f`, and the two must be
        reported as two dashboard numbers rather than netted into one. Every number here
        is one get-method on the one contract that owns it — `getFloorDen` on the ledger,
        `get_jetton_data` on the jetton master, `getBurnStats` on the ratchet,
        `getVaultPayouts` on the bounty vault,
        `get_wallet_data` on the vault's own jetton wallet — and `provenance` is an array
        with one entry per number, so nothing is attributed to a call it did not come from.


        There is ONE burn authority since D-212 deleted the naming sink (naming is paid in
        GRAM). `burnedPrimes` is the ratchet's swap-and-burn and the third term of the identity
        §3.3 publishes as checkable in get-calls:
        `S − getUnmintedHeld() == jetton master total_supply + cumulative burns`.


        The vault and voucher figures degrade to `null` (with their names listed in
        `unavailable`) when that role's address is not configured. `circulatingPrimes` and
        `mintable` degrade to `null` (GAUNTLET.md E11) if `get_jetton_data` itself throttles or
        fails on a cold cache — `sPrimes` never does, since it is served through the shared,
        independently-cached ledger counters. `burnCounting`
        is a separate flag from a null total: `false` means the ratchet's own jetton wallet
        has not been wired yet, so the total is a floor rather than a measurement.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sPrimes:
                        type: string
                        description: Cumulative emission incl. the genesis vault. Never decrements (§5).
                      maxSupplyPrimes:
                        type: string
                        description: >
                          D-156's `S_MAX` — the ceiling `S` approaches and never reaches, read from
                          `getMaxSupply()` on the ledger. Emission is multiplied by
                          `(S_MAX - S)/S_MAX`, so the rebate rate falls to zero as `S` closes on the
                          cap.
                      circulatingPrimes:
                        type: [string, "null"]
                        description: >
                          TEP-74 `total_supply` — minted minus burned. Null (with "circulatingPrimes"
                          in `unavailable`) on a get_jetton_data read failure (GAUNTLET.md E11).
                      mintable:
                        type: [boolean, "null"]
                        description: Null under the same condition as `circulatingPrimes` — same call.
                      burnedPrimes:
                        type: string
                        description: Measured on the ratchet.
                      burnEvents: { type: integer }
                      burnCounting:
                        type: boolean
                        description: False = counter not armed, so the total is a floor, not a measurement.
                      unmintedPrimes:
                        type: string
                        description: >-
                          D-52. Emission counted in `S` whose `jetton_mint` bounced and has not been
                          replayed by `retry_mint`. Reads "0" on a healthy deployment. Not a loss of backing — `S` is
                          never decremented (concept §3.3/§5), so a non-zero value means `p_f = T/S`
                          understates backing, the conservative direction, and the emission is
                          recoverable by anyone calling `retry_mint` for that address.
                      vaultPaidPrimes: { type: [string, "null"] }
                      vaultPayoutCount: { type: [integer, "null"] }
                      programPaidPrimes:
                        type: [string, "null"]
                        description: "DESIGN.md G37 — `getProgramPayouts().paidTotal` on the voucher program; reconciles against the vault's allow-list spend on the quests tag. Never summed with `vaultPaidPrimes`."
                      programClaimCount: { type: [integer, "null"] }
                      burnWalletAddress:
                        type: [string, "null"]
                        description: "DESIGN.md G40b — `getBurnWallet()` on the ratchet: the jetton wallet whose notifications `burnedPrimes` counts. Null until the wallet is set."
                      vaultRemainingPrimes:
                        type: [string, "null"]
                        description: The vault's jetton-wallet balance, so `size − paid ≈ balance` is checkable.
                      vaultDeferredCount:
                        type: [integer, "null"]
                        description: "`getDeferredPayouts` — bounty payouts the vault owes and has not delivered. A liability, never a supply band. Anyone may clear one with `retry_bounty_payout`."
                      vaultJournalKey:
                        type: [integer, "null"]
                        description: "`getDeferredPayouts` — the next journal key; a retry walks `0 .. vaultJournalKey − 1`."
                      stakedPrimes:
                        type: "null"
                        description: Staking does not ship in v1 (§5.3 / §11.18). Null is "not shipped", not zero.
                      unavailable:
                        type: array
                        items: { type: string }
                      derived:
                        type: object
                        description: >
                          The one computed value, kept out of the measured block. `S − total_supply`
                          is everything ever removed from circulation — it also carries the vault's
                          unspent tokens and any bounced rebate mint — and is NOT the burn total:
                          compare it against `burnedPrimes`, the one burn authority, side by side
                          rather than netted.
                        properties:
                          removedFromCirculationPrimes:
                            type: [string, "null"]
                            description: Null when `circulatingPrimes` is — the subtraction needs both halves.
                          derivation: { type: string }
                          note: { type: string }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /primes/wallet/{address}:
    get:
      tags: [ledger]
      summary: An owner's own PRIMES jetton wallet address, and its balance.
      description: >
        A TEP-74 `transfer` leaves FROM the owner's own jetton wallet — not from their TON
        wallet and not from the master — and nothing on chain publishes a stranger's jetton
        wallet. It is derived with `get_wallet_address(owner)` on the MASTER, and the PRIMES
        master is a configured role on this service, so the derivation is available here.
        (`/lp/positions/{address}` returns `lpJettonWallet: null` with a reason for the
        mirror-image case: the DeDust LP master is NOT configured, so that one genuinely
        cannot be resolved by this service.)


        The balance rides along because every spend control needs both — an affordability
        gate is the difference between refusing locally and letting the wallet throw.


        `walletDeployed: false` means the owner has never held PRIMES, so their wallet is
        not on chain yet. The ADDRESS is still correct: `get_wallet_address` is a pure
        function of owner and master, so it answers for a wallet that does not exist, which
        is exactly the wallet the first transfer will deploy. That is a different state from
        a balance of zero, which is a wallet that exists and is empty.


        Two cache tiers, deliberately: the derivation never changes for a given owner and is
        cached as immutable; the balance changes on every transfer and is on the fast tier,
        because a spend control gating on a stale balance would refuse money the player
        already has, or offer money they have already spent. Unbounded cardinality, so it
        carries the inbound rate limit.
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
          description: The owner's TON address. A malformed one is a 400, not a 503.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      owner: { type: string }
                      walletAddress:
                        type: string
                        description: >-
                          `get_wallet_address(owner)` on the PRIMES master. Correct whether or
                          not the wallet has been deployed.
                      walletDeployed:
                        type: boolean
                        description: >-
                          False = never held PRIMES, so the wallet is not on chain yet. Not the
                          same claim as a zero balance.
                      balancePrimes:
                        type: [string, "null"]
                        description: Null iff `walletDeployed` is false. Never a stand-in zero.
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "400": { description: Not a TON address. }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /vesting:
    get:
      tags: [ledger]
      summary: The treasury's genesis PRIMES vest (GAUNTLET.md E14, D-77/D-100/D-166). 30s tier.
      description: >
        Backed by `getVesting` and `getVestingSchedule` on the treasury's instance of
        `primes_vesting.tolk`: 1,000,000 PRIMES whose beneficiary is `primes_treasury.tolk`
        (no key), unlocking in four equal 25% tranches 90 days apart. D-166 deleted the
        operator's lock, so this is the only genesis PRIMES allocation there is, and §2
        point 4's "team takes fees, never supply" is checkable here in one call.

        Not economic state — the vest moves custody of an already-counted allocation, never
        `S` or `T` (see the contract's own header), so it carries no ratchet or solvency
        implication either way.

        `unlocked`/`tranches` is the shape CLAUDE.md's frontend rule asks for: a bounded
        quantity renders as four segments lit in sequence, not a printed fraction, with
        `nextUnlockAt` driving the countdown on the unlit one. `releasedAmountNanoprimes` is
        what has been PUSHED OUT via `release()`, not what has matured.

        `503` names `PRIMES_TREASURY_VESTING_ADDRESS` until it is configured — never a zeroed
        schedule, which a UI would draw as a real lock that has vested nothing.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/VestingLock" }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  # ---------------------------------------------------------------------------
  # THE GOVERNED TREASURY, THE LP MINER, AND LOCKED DEPTH
  # DECISIONS.md D-100 / CONCEPT.md §5.5. Contracts: primes_treasury.tolk,
  # primes_lp_position.tolk (one child per depositing wallet), primes_lp_sink.tolk.
  #
  # THE RULE THAT GOVERNS EVERY ROUTE IN THIS GROUP (D-100 point 4): LOCKED DEPTH IS
  # NEVER SUMMED INTO `T`, into the floor `p_f = T/S`, or into any solvency figure.
  # A DeDust pool's GRAM/PRIMES composition moves with every trade, so an LP-derived
  # term is non-monotonic and would void CONCEPT.md §5's ratchet theorem. Two
  # guarantees, two panels: the floor (a redemption ratio, monotonic) and the
  # liquidity (locked forever / committed >= 30d / withdrawable).
  #
  # AND THERE IS NO APY ANYWHERE IN THIS GROUP. The mining rate floats with both the
  # treasury's PRIMES balance and the total locked LP (D-100 point 10c), so the
  # contract publishes the INPUTS and refuses to compute a yield. A surface that
  # shows one derives it at render and labels it an estimate.
  # ---------------------------------------------------------------------------
  /treasury:
    get:
      tags: [treasury]
      summary: The governed treasury's four balances, the proposal cap and the two LP ladders. 30s tier.
      description: >
        Backed by `getTreasuryBalances`, `getGov`, `getVoteMultipliers`, `getTierTerms` and
        `getTreasuryConfig` on `primes_treasury.tolk`. One contract's own get-methods reported
        verbatim, one provenance entry each — the same shape `/supply` and `/vesting` have.
        D-168 deleted the LP miner (and TR-1 with it); the treasury's PRIMES reach stakers
        through `distribute()`, which `/stake` serves.

        `lpHeldRaw` is the DEPOSITORS' LP and is never proposable (invariant TR-5); since
        D-167 it is all the LP the treasury holds. `tonBalanceNanoton` is already net of the contract's rent floor, so
        it is the same figure the proposal cap is enforced against on chain.

        **UNITS.** GRAM is `...Nanoton`, PRIMES is `...Nanoprimes`, and LP is `...Raw` —
        because LP is a DeDust jetton with ITS OWN decimals, which this service does not read
        and must not assume are nine. An LP figure may only ever be compared against another
        LP figure.

        **THE FOUR LIFETIME FEE COUNTERS ARE READ OFF THE LEDGER, NOT THE TREASURY**
        (`getOperatorTotals`, GAUNTLET.md S30). They are here because they are the only
        on-chain answer to "where did the balance above come from", and the treasury does not
        publish it. Their provenance entry names the LEDGER's address — check it, because it
        is the one entry in this response that does. Reported verbatim, never summed with a
        treasury figure.

        `treasuryPaidTonNanoton` is **§4.1's 5% line (D-152) plus the governed treasury's
        58% share of an unsold-prime forfeit (§6 point 2, D-166)**: every ordinary mint pays this
        contract 5%. `operatorPaidTonNanoton` is the operator's 42% remainder of that same
        forfeit and nothing else, so it stays at 0 until a mint cites a prime nobody owns.
        A surface that adds the two and calls the sum "treasury revenue" is still wrong —
        one recipient is a contract with no key and the other is a wallet with one.

        All four are `null` when the counters could not be read — no `PRIMES_LEDGER_ADDRESS`
        on this service, or no account behind it. `null` is "not read" and is a
        different claim from the real `0` that `opsSweptTonNanoton` carries until the first
        `sweep_ops` runs.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tonBalanceNanoton: { type: string }
                      primesBalanceNanoprimes: { type: string }
                      lpHeldRaw: { type: string, description: The depositors' LP. Never proposable (TR-5). }
                      primesInNanoprimes: { type: string }
                      tstonBalanceNano:
                        type: string
                        description: >
                          D-151 / §4.3.2 — the FOURTH pot: tsTON harvested out of the ratchet's
                          staked reserve, wholly proposable. Nano-tsTON.
                      proposalCapBps: { type: integer, description: Max share of an asset one proposal may move, at EXECUTE time (TR-3). }
                      proposeMinBps: { type: integer }
                      voteDurationSeconds: { type: integer }
                      noticeDurationSeconds:
                        type: integer
                        description: >
                          `getGov()`'s sixth field — how long a proposal is public before its vote
                          opens (D-173 as amended 2026-11-19). Clock-divided.
                      eligibleWeight: { type: string, description: "The electorate — every running LP term, weighted by vote multiplier." }
                      proposalSeq: { type: integer, description: The NEXT proposal id, so it doubles as the count ever opened. }
                      voteMultipliers: { type: array, items: { type: integer }, description: "Four vote multipliers (30 d / 3 m / 6 m / 1 y)." }
                      tierTermSeconds: { type: array, items: { type: integer }, description: Four clock-divided LP lock terms. }
                      lpJettonWallet:
                        type: string
                        nullable: true
                        description: >
                          `getTreasuryConfig()`. THE ASSET DISCRIMINATOR for `/treasury/ledger`
                          (read-index): PRIMES and LP both arrive as TEP-74
                          `transfer_notification`, so nothing but the forwarding wallet says
                          which. `null` means an inflow is UNCLASSIFIABLE, not that it was PRIMES.
                      primesJettonWallet: { type: string, nullable: true }
                      tstonJettonWallet:
                        type: string
                        nullable: true
                        description: >
                          The third discriminator (D-151). A `harvest()` arrives through the same
                          TEP-74 opcode as PRIMES and LP; this is what tells it apart.
                      walletsSet:
                        type: boolean
                        description: The one-shot `set_wallets` has fired. False means both wallets are `addr_none`.
                      operatorPaidTonNanoton:
                        type: string
                        nullable: true
                        description: >
                          LEDGER `getOperatorTotals`. Lifetime nanoton: the operator's 42%
                          remainder of every §6 point 2 forfeit, and nothing else (D-152, D-166).
                      treasuryPaidTonNanoton:
                        type: string
                        nullable: true
                        description: >
                          LEDGER `getOperatorTotals`. §4.1's 5% line (D-152) plus the governed
                          treasury's 58% forfeit share (D-166).
                      opsSweptTonNanoton:
                        type: string
                        nullable: true
                        description: LEDGER `getOperatorTotals`. `sweep_ops` — lifetime gas & ops surplus returned to the ratchet pool (D-117), not operator income; a real 0 until the first sweep.
                      premiumTreasuryPaidTonNanoton:
                        type: string
                        nullable: true
                        description: LEDGER `getOperatorTotals`. D-114's treasury share of an auction premium.
                      inviteSpend:
                        type: object
                        nullable: true
                        description: >
                          DESIGN.md G33 — LEDGER `getInviteSpend` (§4.1's invite line, D-101), lifetime:
                          slots declared, invite transfers sent, slots that fell to β, and the GRAM
                          the line cost. Not a treasury inflow; null = not read.
                        properties:
                          slotsFunded: { type: string }
                          transfersSent: { type: string }
                          slotsToPool: { type: string }
                          valueDeliveredNanoton: { type: string, description: "D-215 — GRAM invitees received, summed at each mint's live value." }
                          linePaidNanoton: { type: string, description: "What the line took off β — valueDelivered plus INVITE_SEND_FEE per transfer." }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /treasury/proposals:
    get:
      tags: [treasury]
      summary: The proposal book with tallies AND executability, newest first. 30s tier.
      description: >
        Backed by `getGov`, and by `getProposal(seq)` + `getExecutable(seq)` per row on
        `primes_treasury.tolk`.

        **`getExecutable` rides along with every row on purpose.** Without it a client has to
        re-derive the close time, the strict-majority rule (`yes > no` — a tie FAILS) and the
        25% cap against the balance at execute time in order to decide whether to enable an
        Execute button: three pieces of consensus logic reimplemented in TypeScript, which is
        the class of drift CONCEPT.md §9.1 exists to prevent. `reason` is the error code
        `execute` WOULD throw (1153 no such proposal, 1158 still open, 1159 already executed,
        1160 not passed, 1161 over the cap, 1162 over the balance), so the button can be
        disabled with a reason instead of provoking the throw.

        Exact for every asset since D-168: nothing accrues inside the treasury.

        Capped at the 50 newest proposals; `omitted` says how many older ones were not read.
        A proposal's vote lasts one day and one proposer may hold one open proposal at a time
        (D-100 point 8), so the cap covers everything still votable many times over.

        A settled proposal is pruned off the chain (D-188 point 7: failed and closed, or past
        its one-vote-duration execute window), so the list has gaps; `proposalCount` still
        counts every proposal ever opened.

        **`?voter=<address>` (G31)** folds `getVotedCount(seq)` on that wallet's POSITION
        CHILD into every row as `hasVoted` — D-188 point 7 keeps the one-vote record on the
        voter's own child. The child records PRESENCE only, no side, so `hasVoted` must never
        be read as "voted yes" or "voted no" — only as "this wallet already cast one". A
        wallet with no child reads `false`. `null` on every row when `voter` is omitted.
      parameters:
        - name: voter
          in: query
          required: false
          schema: { type: string }
          description: >
            A TON address. When given, every row's `hasVoted` reflects `getVotedCount(seq)`
            on that wallet's position child.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      proposals:
                        type: array
                        items:
                          type: object
                          properties:
                            seq: { type: integer }
                            found: { type: boolean }
                            proposer: { type: [string, "null"] }
                            asset: { type: integer, description: "0 = GRAM, 1 = PRIMES, 2 = tsTON (D-167), 3 = venue confirm (D-194)." }
                            amountRaw:
                              type: string
                              description: >
                                Nanoton for asset 0, nanoprimes for asset 1, nano-tsTON for
                                asset 2 — one field whose unit is decided by another field.
                                For asset 3 (D-194) it is the venue timelock record's `seq`,
                                not a quantity: no value moves.
                            dest: { type: [string, "null"] }
                            proposedAt:
                              type: integer
                              description: >
                                When it was proposed: `opens` less `getGov().noticeDuration`,
                                derived here — the contract stores no such field.
                            opens: { type: integer, description: "When the VOTE opens — the end of the notice (D-173 as amended 2026-11-19). A vote before it is refused 1206." }
                            closes: { type: integer }
                            yes: { type: string }
                            no: { type: string }
                            executed: { type: boolean }
                            executable: { type: boolean }
                            reason: { type: integer, description: The throw code `execute` would raise, or 0. }
                            capRaw: { type: string }
                            availableRaw: { type: string }
                            hasVoted:
                              type: [boolean, "null"]
                              description: >
                                `getVotedCount(seq) > 0` on the `?voter=` wallet's position child.
                                `null` when no `voter` was given. Presence only — never which
                                way the wallet voted.
                      proposalCount: { type: integer }
                      listed: { type: integer }
                      omitted: { type: integer }
                      capBps: { type: integer }
                      eligibleWeight: { type: string }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "400": { description: "?voter= is not a valid TON address." }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /stake:
    get:
      tags: [treasury]
      summary: "PRIMES staking (D-168): the treasury's distribute() pot, the stream, ST-1/ST-2 and both ladders. 30s tier (accNow 5s)."
      description: >
        Backed by `getStakeSolvency`, `getStakeStream`, `getAccNow`, `getStakeTotals`,
        `getTierTerms`, `getTierWeights` and `getStakeConfig` on `primes_stake.tolk`;
        `get_wallet_data` on the master's PRIMES jetton wallet; and `getDistribution` +
        `getTreasuryBalances` on `primes_treasury.tolk` (all treasury fields are `null` when
        this service has no `PRIMES_TREASURY_ADDRESS`).

        Two fields are derived, and only these two: `nextDistributeAt` =
        `lastDistributeTime + distributeIntervalSeconds` (the contract's own definition of
        "due"), and `solvencyHolds` = ST-1, `walletBalance >= locked + streamRemaining +
        unclaimed` (`null` when the wallet could not be read, with `walletUnavailable`
        naming why). There is no APY field.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stakeAddress: { type: string }
                      treasuryPrimesNanoprimes: { type: string, nullable: true, description: "The treasury's PRIMES — the pot distribute() draws from." }
                      lastDistributeTime: { type: integer, nullable: true, description: 0 until the first distribute(). }
                      distributeIntervalSeconds: { type: integer, nullable: true, description: Clock-divided epoch. }
                      nextDistributeAt: { type: integer, nullable: true, description: lastDistributeTime + distributeIntervalSeconds. }
                      distributionRateBpsPerDay: { type: integer, nullable: true }
                      nextBudgetEstimateNanoprimes: { type: string, nullable: true, description: The handler's own budget function over today's balance. }
                      distributedTotalNanoprimes: { type: string, nullable: true }
                      streamRateNanoprimesPerSecond: { type: string }
                      streamRemainingNanoprimes: { type: string }
                      streamEnd: { type: integer }
                      lastAccrualTime: { type: integer }
                      rewardPerWeightAcc: { type: string, description: As of the last state-touching message. }
                      accNow: { type: string, description: getAccNow() — the accumulator run forward to now. }
                      accScale: { type: string, description: 2^64. }
                      totalWeight: { type: string, description: Sum of amount x tierWeight over earning positions. }
                      lockedTotalNanoprimes: { type: string }
                      unclaimedTotalNanoprimes: { type: string }
                      walletBalanceNanoprimes: { type: string, nullable: true }
                      walletUnavailable: { type: string, nullable: true }
                      solvencyHolds: { type: boolean, nullable: true, description: ST-1. False is a broken invariant. }
                      budgetsInNanoprimes: { type: string }
                      claimedTotalNanoprimes: { type: string }
                      livePositions: { type: integer }
                      stakeEvents: { type: integer }
                      budgetEvents: { type: integer }
                      tierTermSeconds: { type: array, items: { type: integer }, description: Four clock-divided lock terms. }
                      tierWeights: { type: array, items: { type: integer }, description: "Four stake weights (5/6/7/8)." }
                      jettonWallet: { type: string, nullable: true }
                      walletSet: { type: boolean }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /stake/{address}:
    get:
      tags: [treasury]
      summary: One wallet's stake positions, each with its live claimable PRIMES, read off its own stake child. 5s tier.
      description: >
        Backed by `getStakePositionAddress(owner)` and `getAccNow()` on `primes_stake.tolk`,
        then `getPositions()`, `getPosition(id)` and `getClaimable(id, accNow)` on that
        wallet's `primes_stake_position.tolk` child. `claimableNanoprimes` is the master's
        settle rule (maturity proration included) run as a read, against the `accNow` this
        response publishes. A wallet that never staked answers
        `{"data":{"found":false},"code":"CONTRACT_NOT_DEPLOYED"}`. Walks ids downward from
        the newest and reads at most 32; `idsNotRead` is where it stopped.
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "OK, or `found: false` when the wallet has no stake child deployed."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      found: { type: boolean }
                      owner: { type: string }
                      positionAddress: { type: string }
                      positionCount: { type: integer }
                      nextId: { type: integer }
                      stakedTotalNanoprimes: { type: string }
                      accNow: { type: string }
                      idsNotRead: { type: integer }
                      positions:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            amountNanoprimes: { type: string }
                            tier: { type: integer }
                            lockedAt: { type: integer }
                            maturesAt: { type: integer, description: Earning stops and withdraw opens here (ST-3). }
                            lastSettleTime: { type: integer }
                            expired: { type: boolean }
                            bankedNanoprimes: { type: string }
                            inFlight: { type: boolean }
                            claimableNanoprimes: { type: string }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "400": { description: Not a valid TON address. }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /lp/positions/{address}:
    get:
      tags: [treasury]
      summary: One wallet's LP custody positions, read off its own position child. 5s tier.
      description: >
        Backed by `getPositionAddress(owner)` on `primes_treasury.tolk`, then `getPositions()`
        and `getPosition(id)` on that wallet's `primes_lp_position.tolk` child. The path
        predates D-168; an LP position now carries a term and a vote and earns nothing.

        A wallet that has never deposited has no child deployed. That answers `200` with
        `{"data":{"found":false},"code":"CONTRACT_NOT_DEPLOYED"}` and the provenance of the
        call that produced it — the same shape an unminted number gets. It is a fact about
        the wallet, not a failure of this service.

        `maturesAt` on each position is the instant `withdraw` stops throwing AND `vote`
        starts throwing — under D-147 the same instant, and the bounded quantity the tier
        ring fills toward. `expired` is bookkeeping, not a state a player acts on: it says
        whether the position's vote weight has been taken out of the published aggregates
        yet, and the live truth is `maturesAt` against the clock.
        Position ids are never reused, so the route walks the id range DOWNWARDS from the
        newest and reads at most 32; `idsNotRead` is the id below which it stopped.
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "OK, or `found: false` when the wallet has no position child deployed."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      found: { type: boolean }
                      owner: { type: string }
                      positionAddress: { type: string }
                      positionCount: { type: integer }
                      nextId: { type: integer, description: Exclusive upper bound of the id range. }
                      voteWeight: { type: string, description: Sum of amount x voteMultiplier over unexpired positions, plus the forever total's weight (D-214). }
                      idsNotRead: { type: integer }
                      forever:
                        type: object
                        description: >
                          D-214, `getForever()` on the child: LP this wallet locked forever through
                          `to_sink`. It votes `amountRaw x multiplier` under position id 0xFFFFFFFF,
                          never matures, and counts only on proposals opened after `since`.
                        properties:
                          amountRaw: { type: string }
                          since: { type: integer }
                          multiplier: { type: integer }
                      lpJettonWallet:
                        type: [string, "null"]
                        description: >
                          Always null today, with `lpJettonWalletUnavailable` naming why: a TEP-74
                          transfer is sent from the OWNER's own jetton wallet, whose address is
                          `get_wallet_address(owner)` on the DeDust LP jetton master — a contract
                          this service has no configured role for, because the pairing is manual
                          (D-100 point 4). Resolve it client-side.
                      lpJettonWalletUnavailable: { type: [string, "null"] }
                      positions:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            amountRaw: { type: string, description: Raw LP units. }
                            tier: { type: integer }
                            lockedAt: { type: integer }
                            maturesAt: { type: integer }
                            weightSince: { type: integer, description: "Since when the position has held its current weight; it votes only on proposals whose opens is strictly later, and YES only on proposals proposed at or after it (CONCEPT §5.5.5, 1202)." }
                            expired: { type: boolean }
                            inFlight: { type: boolean }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "400": { description: Not a valid TON address. }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /lp/locked:
    get:
      tags: [treasury]
      summary: Locked depth, and the TR-6 comparison shown rather than asserted. 30s tier.
      description: >
        Backed by `getLocked`, `getEvents` and `getLpSinkConfig` on `primes_lp_sink.tolk`,
        plus `get_wallet_data` on the LP jetton wallet that config names.

        `primes_lp_sink.tolk` declares NO outbound message type at all — LP goes in and
        nothing comes out — so `getLocked()` is monotone non-decreasing and equal to the
        sink's LP jetton wallet balance. **Invariant TR-6 is that one-line audit**, so this
        route serves BOTH numbers side by side with the comparison as a field
        (`declaredMatchesHeld`). A panel that printed only `getLocked()` would be asking a
        reader to take the equality on trust; a panel that printed only the wallet balance
        would lose the contract's own declared figure.

        `heldByWalletNano` is `null` with `heldUnavailable` naming the reason — before the
        genesis one-shot fires there is no wallet to compare against, and before the first
        lock the wallet has no deployed account. Never a fabricated zero.

        **Locked depth is not part of `T`** and no field here may be summed into one that
        is (D-100 point 4). It is a MARKET guarantee — depth nobody can withdraw — sitting
        beside the floor's REDEMPTION guarantee, and the two are different claims about
        different things.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lockedRaw: { type: string, description: "`getLocked()` — the sink's own declared figure, in raw LP units." }
                      events: { type: integer, description: How many separate locks make it up. }
                      lpJettonWallet: { type: [string, "null"] }
                      walletSet: { type: boolean }
                      genesisScript: { type: [string, "null"] }
                      heldByWalletRaw:
                        type: [string, "null"]
                        description: The wallet's actual TEP-74 balance, or null with `heldUnavailable` set.
                      heldUnavailable: { type: [string, "null"] }
                      declaredMatchesHeld:
                        type: [boolean, "null"]
                        description: TR-6, as a comparison the panel renders. Null when the wallet balance could not be read.
                      lpTotalSupplyRaw:
                        type: [string, "null"]
                        description: >
                          `get_jetton_data().total_supply` on the venue pool (the LP jetton master) — every
                          LP token that exists. The denominator that turns `lockedRaw`'s arbitrary unit into
                          the share of the pool nobody can withdraw. Null when the ratchet publishes no venue
                          or the pool is not deployed.
                      note: { type: string }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /lp/wallet/{address}:
    get:
      tags: [treasury]
      summary: The owner's own DeDust LP jetton wallet, its balance and the pool's LP supply.
      description: >
        `/primes/wallet/{address}` for the OTHER jetton. A TEP-74 transfer leaves FROM the
        owner's own jetton wallet, so the control that locks LP into the treasury
        (D-100 point 5) cannot address a message until this answers.

        **The LP jetton master is the venue pool itself** — a DeDust v2 pool is the jetton
        master of its own LP token — so the derivation is `get_wallet_address(owner)` on
        `getVenue().dedustPool`, which this service already reads for `/market`. A ratchet
        that publishes no venue answers every field null with `balanceUnavailable` naming
        the reason, never a fabricated address.

        `balanceRaw` is null with `walletDeployed: false` when the owner has never held LP —
        a jetton wallet is deployed by its first transfer, so that is a fact and not a zero.
        `lpTotalSupplyRaw` is `get_jetton_data().total_supply` on the pool, published as the
        denominator of the constant-product mint rule a provide-liquidity form quotes with;
        the estimate itself is derived at render and labelled there, never here.

        Raw LP units throughout: the DeDust LP jetton carries its own decimals and this
        service does not read them.
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
          description: The owner's TON wallet address.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      owner: { type: string }
                      poolAddress:
                        type: [string, "null"]
                        description: The LP jetton master, which is the venue pool itself.
                      walletAddress: { type: [string, "null"] }
                      walletDeployed: { type: boolean }
                      balanceRaw: { type: [string, "null"] }
                      balanceUnavailable: { type: [string, "null"] }
                      lpTotalSupplyRaw: { type: [string, "null"] }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "400": { description: Not a TON address. }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  # ---------------------------------------------------------------------------
  # Numbers
  # ---------------------------------------------------------------------------

  /number/{n}/prime:
    get:
      tags: [numbers]
      summary: Whether n is a verified prime, per the ledger's on-chain bitmap.
      description: Backed by `isKnownPrime`.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isPrime: { type: boolean }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /numbers:
    get:
      tags: [numbers]
      summary: Ownership and accrued tribute for several numbers in one call.
      description: >
        The ownership-confirmation step behind the /me portfolio rail. The event-poller
        proposes CANDIDATES — mint-time attribution, which goes stale on any NFT transfer,
        unioned with an NFT holder index — and this route settles them: it reads each item's
        own `getNumberData` so the displayed owner is a get-method result (CONCEPT.md §9.1)
        rather than an inference from an indexed mint or a third party's word.
        Batched because a wallet screen asks for its whole portfolio on first paint, and the
        per-number form would serialise into one upstream call per number against the TonAPI
        budget that already produced live 429s. Each n is cached under the same key as
        `/number/{n}`, so repeat renders cost nothing upstream. An unminted number answers
        `minted: false` rather than failing the batch. Truncation beyond `maxPerRequest` is
        reported, never silent.
      parameters:
        - name: ns
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated decimal numbers, e.g. `2,3,5`. Duplicates are collapsed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  numbers:
                    type: array
                    items:
                      type: object
                      properties:
                        n: { type: string }
                        minted: { type: boolean }
                        owner: { type: string, nullable: true }
                        isPrime: { type: boolean, nullable: true }
                        owedNanoton: { type: string, nullable: true }
                        itemAddress: { type: string }
                        provenance:
                          type: array
                          items: { $ref: "#/components/schemas/Provenance" }
                  requested: { type: integer }
                  returned: { type: integer }
                  truncated: { type: boolean }
                  maxPerRequest: { type: integer }
        "400": { description: ns missing, unparseable, or below the start of the number line }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /item/{n}/address:
    get:
      tags: [numbers]
      summary: The item contract address for number n — the address-only half of /number/{n}.
      description: >
        Backed by `getItemAddress`, cached forever once resolved (the address a mint deploys
        to is a pure function of the collection code and n). Exists so the webapp's
        `resolveItemAddress` fallback (GAUNTLET.md P3.G2) does not have to reach TonCenter's
        public, keyless, unrate-limited `runGetMethod` directly to get it.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /wallet/{address}/seqno:
    get:
      tags: [numbers]
      summary: A wallet contract's seqno() — the seqno-inclusion probe's underlying read.
      description: >
        Proxies `seqno()` on an arbitrary wallet address, straight from TonCenter, so
        `webapp/src/chain/useTxConfirmation.ts`'s fallback probe (for send flows with no
        dedicated get-method to watch) does not have to call TonCenter directly
        (GAUNTLET.md P3.G2). `seqno: null` — never a 500 — is the answer for an
        uninitialised wallet, a non-zero exit code, or any transport failure; callers must
        treat null as unknown, never as zero.
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
          description: Any valid TON address form.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      seqno: { type: [integer, "null"] }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /wallet/{address}/balance:
    get:
      tags: [numbers]
      summary: A wallet's GRAM balance — whether it can pay for a mint at all.
      description: >
        The funding check behind the mint control's top-up branch. A newcomer arriving from
        Telegram with an empty wallet is the largest single term in whether they ever mint at
        all — a client that cannot tell "connected" from "connected and funded" offers a
        signature the wallet will refuse.


        This is the raw account state (`getState`), not a get-method, and the provenance
        envelope says so: `getMethod: account_state`. `balanceNanoton: null` — never a 500,
        never a zero — is the answer for any read failure; callers must treat null as
        unknown, because "we could not read your balance" is not "you are broke".
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
          description: Any valid TON address form.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      balanceNanoton: { type: [string, "null"] }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /number/{n}:
    get:
      tags: [numbers]
      summary: Full public state of number n — the item's owner, prime flag, and accrued tribute.
      description: >
        Chains two live lookups: the ledger's `getItemAddress` (cached) resolves n to its item
        contract, then `getNumberData` + `getOwed` are read from that item. Both sub-results
        carry their own provenance.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  # Every number at or ahead of the head derives to an address with no item
                  # deployed at it yet. That is an answer, not a failure — see NotDeployed.
                  - $ref: "#/components/schemas/NotDeployed"
                  - type: object
                    properties:
                      number:
                        type: object
                        properties:
                          data:
                            type: object
                            properties:
                              number: { type: string }
                              owner: { type: string }
                              isPrime: { type: boolean }
                          provenance: { $ref: "#/components/schemas/Provenance" }
                      owed:
                        type: object
                        properties:
                          data:
                            type: object
                            properties:
                              owedNanoton: { type: string }
                          provenance: { $ref: "#/components/schemas/Provenance" }
                      provenance:
                        type: array
                        items: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /number/{n}/name:
    get:
      tags: [numbers]
      summary: Who may name n (its owner), what it is called, and what the next naming costs in GRAM.
      description: >
        CONCEPT.md §4.7.1, DECISIONS.md D-212: the CURRENT OWNER of any minted number, prime
        or composite, names it by sending `name_number` to the collection with GRAM attached —
        the first naming `nameFee`, every later one `renameFee`, the fee credited to the
        ratchet floor. `getNamer()` on item(n) is the owner; `getAnnotation()` on item(n) is
        the count and standing text; `getNaming()` on the collection is the two fees and three
        counters (one shared cache key, not per-n). `fees.nextFee` is `nameFee` when `count`
        is 0, `renameFee` after, and null while n is unminted.

        A primorial (§7's eight) additionally carries `trophy`: the era trophy's separate
        engraving on the registrar — `getTrophy(n)`, `getTrophyAnnotation(n)` and
        `getTrophyRenameFee()` (the first engraving is free). Absent for every other n.

        `namer: null` is `addr_none` or an unminted number with no item. All GRAM figures are
        nanoGRAM as decimal strings. Slow tier, so a buyer sees the pen at most one TTL after
        a transfer.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  namer:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          namer: { type: string, nullable: true }
                      provenance: { $ref: "#/components/schemas/Provenance" }
                  annotation:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count: { type: integer }
                          text: { type: string, nullable: true }
                      provenance: { $ref: "#/components/schemas/Provenance" }
                  fees:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          nameFee: { type: string, description: "nanoGRAM, a first naming." }
                          renameFee: { type: string, description: "nanoGRAM, every later naming." }
                          named: { type: integer, description: First namings relayed. }
                          renamed: { type: integer, description: Renames relayed. }
                          toFloor: { type: string, description: "nanoGRAM of naming fees credited to the floor." }
                          nextFee:
                            type: string
                            nullable: true
                            description: "`nameFee` if count is 0, else `renameFee`; null when n is unminted."
                      provenance: { $ref: "#/components/schemas/Provenance" }
                  trophy:
                    type: object
                    description: Present only when n is one of §7's eight primorials.
                    properties:
                      data:
                        type: object
                        properties:
                          holder: { type: string, nullable: true }
                          annotation:
                            type: object
                            properties:
                              count: { type: integer }
                              text: { type: string, nullable: true }
                          renameFee: { type: string, description: "nanoGRAM, every engraving after the first." }
                      provenance:
                        type: array
                        items: { $ref: "#/components/schemas/Provenance" }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /number/{n}/trophy:
    get:
      tags: [numbers]
      summary: n's era trophy, read as a trophy (holder + transferability) rather than as a naming right.
      description: >
        D-14 (CONCEPT.md §4.7, §7): `getTrophy(n)` on the registrar, distinct from
        `/number/{n}/name` even though, for a primorial, both read the same trophy row —
        that route answers "who names n"; this one answers "is n a movable
        trophy, and who holds it". GAUNTLET.md L3b: filed because the Telegram bot's
        `/wear` command's eligibility rule ("a wearable is minted when a number is named
        OR an era trophy fires", §7) had no way to see the trophy half of that OR without
        this route — `/number/{n}/name`'s `annotation.text` stays null for an
        un-annotated primorial even after its trophy has fired.

        `holder: null` is `addr_none`: either n's era has not closed yet, or n is not one
        of the eight primorials at all — both read the same as "no trophy", which is the
        ordinary state of nearly the whole number line. `transferable` is `true` iff n is
        one of §7's eight primorials (i.e. `TransferTrophy` would accept it) and `false`
        for every other number — a number's own name moves with its owner (D-212) and
        D-14's transferability carve-out never reaches it.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      holder: { type: string, nullable: true }
                      transferable: { type: boolean }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /number/{n}/runway:
    get:
      tags: [numbers]
      summary: Seconds until n's item account freezes for unpaid storage rent.
      description: >
        CONCEPT.md §3.1 / §9.1, GAUNTLET.md PS1: `getStorageRunway()` on the item, priced
        against the config-18 storage schedule in force in the block that answers rather
        than against a baked figure — so a network fee change is reflected with no redeploy.

        WHY THIS EXISTS. TON charges storage rent forever, and a **composite** item is
        endowed once with `ITEM_DEPLOY_VALUE` at mint and never topped up again: only primes
        receive `credit_tribute`. Its balance is therefore a finite tank, and when it empties
        the account FREEZES — no transfer, no `get_nft_data`, no claim, nothing — until
        somebody funds it. `TopUp` is permissionless (DECISIONS.md D-62), so this reading is
        published to every caller and not only to the holder: anybody may defend anybody's
        number, which is what stops the freeze being a trap for an absent owner.

        TWO SENTINELS, AND NEITHER IS A DURATION. `-1` means the contract priced no finite
        runway for the year; `0` means the balance net of accrued-but-unsettled rent is
        already gone. Both travel as the contract's own integer, as a decimal string, and a
        caller that coerces either into "0 seconds left" or into "infinite" is wrong in one
        of the two directions that matter.

        Its own route rather than a third upstream call folded into `/number/{n}`, for the
        reason `/number/{n}/name` records: that route polls on the FAST tier for every number
        page, while a runway moves only with the wall clock and with a `TopUp`. Slow tier,
        one cache key, and a caller that never asks about rent never pays for the call.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      runwaySeconds:
                        type: string
                        description: >
                          Decimal integer. Seconds remaining, or `-1` (no finite runway) or
                          `0` (already out). Read `getStorageRunway` in
                          `contracts/contracts/primes_item.tolk` before treating it as a number.
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /number/{n}/tribute:
    get:
      tags: [numbers]
      summary: Cumulative divisor tribute ever credited to n's item.
      description: >
        CONCEPT.md §3.2.1 / §9.1: `getTributeTotal()` on the item — every `credit_tribute`
        amount it has received, never decremented. A claim zeroes `owed`, not this, so this
        is the prime's "paid to date" and `owed` is only what is still unclaimed. The flat
        prime dividend is not included; it settles on the ledger. Its own route so an item
        deployed before the counter existed fails this read alone.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tributeTotalNanoton: { type: string, description: Decimal nanoGRAM. }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /assets/{n}/yield:
    get:
      tags: [assets]
      summary: Trailing cash-flow rate of number n, derived from `owed` deltas over head progress.
      description: >
        CONCEPT.md §5.4 argues that each mint's value rotates toward the numbers as
        `k_max(n)` decays. A holder cannot act on that without being able to price what they
        own — and every asset in the design exposes a **stock** (`getOwed`, `getDivAcc`,
        `getClaimableDividend`) while nothing exposes a **rate**. Storing trailing counters
        on-chain was rejected: it spends gas and state rent against the 20% line §12 calls
        the tightest budget in the system, for a number already implied by public state.

        So the rate is derived here, under §9.1's rule for derived numbers: **a rate may be
        displayed if the derivation is published next to it.** The response carries the two
        `owed` readings, the heads they were read at, the get-methods behind each, and the
        arithmetic, so a reader recomputes the rate rather than trusting it.

        `derived: true` is load-bearing. The *stocks* are chain state and carry provenance;
        the *samples* are this process's own memory, which is §12's "the growth backend is a
        trusted display layer" in its narrowest possible form. A restart drops the history
        and `rate` goes `null` with `unavailableReason` set — the honest outcome, never a
        seeded zero. Denominated in head progress rather than seconds, like every other clock
        in the design (§4.6, §5, §7): a quiet week is not a collapse in an asset's value.

        A tribute claim zeroes `owed` (§3.2.1). That is the asset being paid, not the asset
        earning less, so a negative delta restarts the window instead of being averaged
        through. The flat dividend's per-prime half (`getClaimableDividend`) rides beside
        `owed` as `stocks.claimableDividendNanoton`.

        **A number ahead of the head answers `200` with `minted: false`, `rate: null` and
        `stocks: null`.** Items are deployed by the mint, so every unminted number is a valid
        address with no account behind it. That is the answer "not minted yet", it covers the
        entire number line above the head, and reporting it as a 500 would render the busiest
        half of the line as a broken backend.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      n: { type: string }
                      derived:
                        type: boolean
                        description: Always true. This number is the proxy's arithmetic, not a get-method result.
                      minted:
                        type: boolean
                        description: >
                          Present and `false` only when n is ahead of the head. `rate` and `stocks`
                          are then both null and `unavailableReason` names the current head.
                      derivation:
                        type: object
                        properties:
                          formula: { type: string }
                          unit: { type: string }
                          basis: { type: string }
                          note: { type: string }
                      inputs:
                        type: object
                        description: The two readings the rate is computed from. Operator-sampled.
                        properties:
                          first: { $ref: "#/components/schemas/YieldSample" }
                          latest: { $ref: "#/components/schemas/YieldSample" }
                      rate:
                        nullable: true
                        type: object
                        properties:
                          tonPer1000HeadProgress: { type: number }
                          headProgress: { type: string }
                          owedDeltaNanoton: { type: string }
                      unavailableReason:
                        type: string
                        nullable: true
                        description: Why `rate` is null — one sample only, a static head, or a claim inside the window.
                      stocks:
                        type: object
                        nullable: true
                        description: >
                          The on-chain half. These carry provenance; the rate does not. `null` when
                          the number has not been minted — there is no item contract to read.
                        properties:
                          owedNanoton: { type: string }
                          claimableDividendNanoton: { type: string }
                          claimableDividendGetMethod: { type: string }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "400": { description: n is not a decimal number, or is below 2. }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /lots/fee-split:
    get:
      tags: [lots]
      summary: RES_GAS and SETTLE_GAS, from the market (CONCEPT.md §4.4 point 1, D-30). 30s tier.
      description: >
        Backed by `getResFeeSplit`, which D-30/D-37 reduces to a PAIR. `RES_PRIORITY_BASE`
        is deleted with the flat-fee lane (there is no book to buy a place in) and
        `RES_PREMIUM` is deleted as a fee (nothing is charged as a scored fee), so
        `resPriorityNanoton` and the `resFeeNanoton` sum that added them are GONE from this
        response rather than reported as zeros — a fee the contract does not charge has no
        get-method behind it, and §9.1 does not admit a substitute computed server-side.

        `RES_GAS` is the one fee left: never waivable, never payable in PRIMES. That is the
        whole anti-abuse argument — a waiver able to reach it would let a wallet hold the
        line for free and park the head, which §12 calls the highest-severity risk.

        `settleGasNanoton` is the slice of `RES_GAS` the market forwards to the ledger with
        the winning lot's mint. It is what keeps that mint OFF §4.1's 20% gas & ops line: the
        winner funds their own settlement rather than the pool funding it.

        The router publishes the first of the two on its own as `getResGas()`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      resGasNanoton: { type: string }
                      settleGasNanoton: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /number/{n}/off-head:
    get:
      tags: [numbers]
      summary: Whether n is off the sequential line — a lot has claimed it, so the head skips it forever (CONCEPT.md §4.4).
      description: >-
        Backed by the ledger's `isNumberOffHead`. Beyond the ledger's import frontier (D-196)
        that answers -1 and the claim mark lives on the block's lot block, so the proxy follows
        it: `getLotBlockAddress((n - 2) >> 8)` on the ledger, then bit `(n - 2) & 255` of `claimed` from
        that contract's `getWords()`. An undeployed lot block reads as not claimed. One
        upstream call below the frontier, three beyond it.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isOffHead: { type: boolean }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  # ---------------------------------------------------------------------------
  # Audit and registrars
  # ---------------------------------------------------------------------------

  /solvency:
    get:
      tags: [audit]
      summary: Per-contract balance vs. declared liability (CONCEPT.md §3.4). 30s tier.
      description: >
        Backed by `getSolvency()` on each configured contract, which returns
        `(balance, liability, delta)` in ONE get-call — that is precisely the property §3.4's
        decomposition exists to produce, and "one of the few things a skeptic can check per
        block without trusting anything". The proxy reports the contract's own subtraction
        rather than recomputing it.

        One cache key covers every contract, because the block that renders this (§6 D7) shows
        them as a set and one key per contract would put the audit block on the rate-limit
        critical path. Contracts sharing an address (pre-decomposition, ledger and ratchet are
        one account) are deduplicated so no balance is counted twice.

        The bounty vault declares no `getSolvency` (it custodies PRIMES, not a GRAM liability),
        and a role with no deployed account has none either: both report `available: false`
        with their real account balance and a null liability, rather than a blanked row.

        `trophyAuction` is in this set because it holds a real, live liability, not because
        it is another address worth listing: every open lot's standing high bid sits on that
        account until the lot closes, and the outbid refund is immediate and in-transaction
        (CONCEPT.md §4.4 point 1b), so `balance ≈ Σ standing bids + unforwardedPremium` is
        exactly §3.4's checkable property, read off its own `getSolvency`.

        `provenance` is an ARRAY, one entry per contract.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      contracts:
                        type: array
                        items:
                          type: object
                          properties:
                            contract:
                              type: string
                              enum: [ledger, ratchet, registrar, market, bountyVault]
                            address: { type: string }
                            balanceNanoton: { type: string, nullable: true }
                            declaredLiabilityNanoton: { type: string, nullable: true }
                            deltaNanoton:
                              type: string
                              nullable: true
                              description: balance − liability, as the contract computes it. Negative is insolvency.
                            liabilityBreakdown:
                              type: object
                              nullable: true
                              description: >
                                CONCEPT §9.1. `declaredLiabilityNanoton` itemized, from the contract's own
                                `getLiabilityBreakdown`. Present on the ledger row only — the other contracts
                                each have a single-line liability that the total already states — and `null`
                                elsewhere, which is a legitimate state rather than an error. The three
                                components always sum to `declaredLiabilityNanoton`.
                                `tributeOwedNanoton` is the load-bearing one: §3.2's tribute is credited to an
                                NFT item as a NUMBER while the GRAM stays on the ledger, so it is money already
                                promised to named owners that would otherwise be indistinguishable from
                                protocol float. A reader reconciles it against `Σ_p get_owed(p)`.
                              properties:
                                tributeOwedNanoton: { type: string }
                                unroutedHeldNanoton: { type: string }
                                divOutstandingNanoton: { type: string }
                                feeHeldNanoton: { type: string, description: "G81: fee legs held below one hop's gas (ledger treasuryHeld + operatorHeld)" }
                              required: [tributeOwedNanoton, unroutedHeldNanoton, divOutstandingNanoton, feeHeldNanoton]
                            getMethod: { type: string }
                            available: { type: boolean }
                  provenance:
                    type: array
                    items: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /earn/{address}:
    get:
      tags: [registrars]
      summary: >
        The chain half of the `/earn` block for one wallet — §4.7 recruit rank,
        the §4.5 newcomer window, and the §5 uplift line. 30s tier.
      description: >
        EARN_PLAN E1.8/E3.4. Backed by three get-methods read under one cache key (D-191
        point 1): the wallet's minter card `getStanding()` (the recruit rank, the newcomer
        window, the uplift legs and their sum, the era tally — a never-deployed card is zero
        standing), the ledger's `getKMaxFor(n, sum)` (the clamp flag) and its
        `getEraLeader()` (the era seq the tally must match). They are collapsed into one route because they only ever
        change together — on a mint — and `/earn` is a polling page, so separate routes would
        be several times the upstream budget for one fact (ops/rate-limit-budget.md §C3.1).


        D-106 REMOVED `getPatronLine` from this call and from the contract: there is no patron
        of record any more, so there is no per-recruit line to read.


        These live on the LEDGER. `/ranks/{address}` reads the registrar for the prime ladder;
        the numbers that decide a mint's rebate ceiling have to be readable synchronously
        inside a mint, so they are the ledger's. `/earn` reads the ledger's, because that is
        the one the split obeys.


        The OFF-CHAIN half of `/earn` — clicks, bot starts, wallet connects, quest scoring,
        voucher issuance — is NOT served here. It comes from the attribution service, and the
        two are deliberately different routes so that a counted off-chain tally can never
        inherit a proved response's provenance (CONCEPT §9.1, EARN_PLAN §6.3).
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
          description: Any valid TON address form.
        - name: head
          in: query
          required: false
          schema: { type: string, pattern: "^[0-9]+$" }
          description: >
            The number to evaluate `getKMaxFor` at, since k_max depends on n. Defaults to
            the current mint head — the number this wallet would mint next — so the uplift
            shown is the uplift the next mint would actually receive.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      address: { type: string }
                      recruitRank:
                        type: object
                        description: >
                          §4.7 / D-106, the recruiter's side — lifetime addresses this wallet
                          introduced with a §4.5 gift mint. Never reset.
                        properties:
                          recruits: { type: string }
                          tier: { type: string }
                          upliftScaled: { type: string }
                          nextTierAt:
                            type: string
                            description: >
                              So the ladder shape can show the distance to the next step
                              without the UI hardcoding the tier thresholds (§9.1).
                      newcomerWindow:
                        type: object
                        description: §4.6, the recruit's raised rebate ceiling.
                        properties:
                          left: { type: string }
                          total: { type: string }
                          upliftScaled: { type: string }
                          opened: { type: boolean, description: "G80: a gift ever opened this window; never cleared" }
                      uplift:
                        type: object
                        description: >
                          §5 — the uplift line itemised rather than totalled, so a player can
                          see WHY their k_max is what it is.
                        properties:
                          primeRankScaled: { type: string }
                          primeWindowScaled: { type: string }
                          newcomerScaled: { type: string }
                          recruitRankScaled: { type: string }
                          summedScaled:
                            type: string
                            description: The RAW, UNCLAMPED sum of the four legs above (D-168 deleted the stake leg).
                          clamped:
                            type: boolean
                            description: >
                              The honest field: whether K_CEIL is currently eating part of
                              what the ladders granted. A rank ladder must never hide this
                              from the player it flattered.
                      eraRecruits:
                        type: string
                        description: >
                          D-36 — this wallet's ERA-SCOPED recruit count: its minter card's
                          era tally when taken under the ledger's current era seq, else 0
                          (D-191 point 1). NOT the same number as
                          `recruitRank.recruits`, which is lifetime and never reset: this one
                          is reset to 0 for every wallet at each primorial ceremony and is
                          the count the era trophy is awarded on. A UI that conflates them
                          shows the wrong contest.
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "400":
          description: The path segment is not a valid TON address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            Upstream throttled and nothing cached was available to fall back on. Never a 500 —
            a 500 on this service means a genuine bug (ops/rate-limit-budget.md).
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ranks/{address}:
    get:
      tags: [registrars]
      summary: An address's position on both rank ladders (CONCEPT.md §4.7, §4.7.1). 30s tier.
      description: >
        Backed by the wallet's minter card `getStanding()` (D-191 point 1: `primesMinted`
        and `recruits`, one call; a never-deployed card is zero standing), so the rank strip
        is one route and one cache key. D-188 point 6 deleted the registrar's `getPrimeRank`
        mirror and D-191 moved both ladders off the ledger onto the card.
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
          description: Any valid TON address form.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      address: { type: string }
                      recruitRank: { type: string }
                      primeRank: { type: string }
                      fresh:
                        type: boolean
                        description: >
                          §4.5's sybil guard, `!getCardOwner().seen` (true for a never-deployed
                          card): a gift mint to this wallet would credit its payer +1 recruit.
                          The mint checkout warns when a gift's beneficiary reads false.
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "400":
          description: The path segment is not a valid TON address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  # ---------------------------------------------------------------------------
  # Venue, auction, vault
  # ---------------------------------------------------------------------------

  /venue:
    get:
      tags: [ratchet]
      summary: The current DeDust venue addresses (native vault, pool, jetton vault). 30s tier.
      description: >
        Backed by `getVenue` — the venue timelock's entire admin surface
        (IMPLEMENTATION_PLAN.md §1 governance row), made publicly checkable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      dedustNativeVault: { type: string }
                      dedustPool: { type: string }
                      primesJettonVault: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /market:
    get:
      tags: [ratchet]
      summary: The PRIMES market price, read off the venue pool's reserves. 30s tier.
      description: >
        Backed by `get_reserves` + `get_assets` on the DeDust pool `getVenue` names.
        The spot price is the pool's MID price (`reserveTon / reservePrimes`) — what a
        zero-size swap would pay, before the pool's own `get_trade_fee` (read alongside and
        published as `tradeFeeNum`/`tradeFeeDen`) and slippage — published as an
        exact `num/den` rational so it compares with `/ledger/floor`'s `p_f` without either
        side being rounded first. `series` is read-proxy's own log of the reads it has made,
        one point per observed price move (plus a heartbeat through quiet hours); no
        get-method anywhere answers "what WAS the price", and this route does not pretend
        otherwise. Replaces the webapp's former `api.dedust.io` call, which was both
        unprovable (§9.1) and mainnet-only.


        `fresh=1` forces ONE live `get_reserves` past the 30s tier — what the app's own swap
        form asks for the moment its send confirms, so the card and the chart show the trade
        that just landed instead of the reading the form quoted from. Throttled to one forced
        read per 5 seconds across all callers (the fast tier's own budget), and a forced read
        that fails falls back to the cached answer rather than failing the card.
      parameters:
        - in: query
          name: fresh
          required: false
          schema: { type: string, enum: ["1"] }
          description: Force one live read past the 30s tier; throttled to one per 5s globally.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [live, no-pool] }
                      poolState: { type: string, enum: [live, not-deployed, not-a-pool] }
                      poolAddress: { type: string }
                      spotNumNanoton: { type: string }
                      spotDenPrimes: { type: string }
                      reserveTonNanoton: { type: string }
                      reservePrimesNano: { type: string }
                      tradeFeeNum: { type: string, nullable: true }
                      tradeFeeDen: { type: string, nullable: true }
                      series:
                        type: array
                        items:
                          type: object
                          properties:
                            t: { type: integer }
                            num: { type: string }
                            den: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  # ---------------------------------------------------------------------------
  # Trophy-number auction (CONCEPT.md §4.4 point 1b; DECISIONS.md D-3…D-8)
  # ---------------------------------------------------------------------------

  /trophy:
    get:
      tags: [trophy]
      summary: Trophy-lane aggregates — open/closed lots and total premium (DECISIONS.md D-7). 30s tier.
      description: >
        Backed by `getMarketStats()` on the market (`primes_market.tolk`); the read-proxy's
        `getTrophyStats` DTO keeps the old name because the `/trophy/*` namespace did.

        `totalPremiumNanoton` is §4.2's live demand signal: premium is injected into the
        ratchet at CLOSE and can never walk back out. It is `k = 0` money in §5.1's exact sense: `T` rises, `S` is untouched,
        `p_f = T/S` rises by the full amount.

        `unforwardedPremiumNanoton` is the honesty term — premium this contract booked but
        the ledger has not accepted, sitting on a contract with no withdraw path and
        retryable by anyone through the permissionless `retry_premium_forward`. It should be
        "0"; a persistent non-zero is a real finding, which is why it is published rather
        than netted out of the total.

        `headHint` is the market's lagging cache of the ledger head, raised only by
        `head_update`. It is a cheap pre-filter for `open_lot` (`n > headHint`) and gates a
        prime's Dutch lot (`n < headHint`, D-88 point 3); the ledger stays authoritative.
        backend/keeper calls the permissionless `sync_head` on a schedule to keep the gap
        to `GET /ledger/head` small.

        `forceCancels` (D-90) counts lots unwound by a ledger `mark_rejected` race loss.

        30s tier, unlike `/trophy/lot/{n}`. Every field here moves only on an `open` or a
        `close` — events measured in tens over the lane's life, not in seconds — and none is
        a number anyone must act on before the next block. The number a bidder acts on is on
        the lot route, which is fast.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      openLots: { type: string }
                      closedLots: { type: string }
                      totalPremiumNanoton: { type: string }
                      unforwardedPremiumNanoton: { type: string }
                      headHint: { type: string }
                      forceCancels: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /trophy/lot/{n}:
    get:
      tags: [trophy]
      summary: One trophy lot's LIVE bid state, including snipe extensions. 5s tier.
      description: >
        Backed by `getLot(n)` on the trophy auction. The only fast-tier route in this block,
        and the tier is the whole point of the split.

        `highBidNanoton` and `closesAt` move on every bid, and both are numbers a bidder acts
        on within seconds. `closesAt` is the LIVE close time including every 67-minute
        `BID_EXTENSION` applied so far — decision D10 applies it as
        `closesAt = max(closesAt, now + BID_EXTENSION)`, so a bid more than 67 minutes out
        changes nothing and a bid inside that window buys a full 67 minutes of quiet. A 30s
        cache here would show a stale high bid to someone about to be outbid and a stale
        close time to someone deciding whether they still have time to respond — which is
        precisely the sniping failure `BID_EXTENSION` exists to remove, reintroduced by the
        cache.

        `minNextBidNanoton` is exactly what the `bid` handler measures the incoming value
        against: `high + max(MIN_INCREMENT_FLOOR, MIN_INCREMENT_PCT% · high)`, i.e.
        `max(1 GRAM, 5% · high)` at the shipped constants. Callers must still add a fee margin
        on top — the contract rejects an exact nominal on a busy block.

        There is no ceiling field and no `take` lane, unlike `/auction/lot/{prime}`: this is
        an ascending-only hard-close auction, and `p0Nanoton` is the OPENING BID, not a
        ceiling. There is also no no-bid state — opening a lot requires a bid at or above
        `P0(n)`, so a found lot always has a standing bidder and a closed lot always has a
        winner (§2: four states that do not exist cannot be got wrong).

        `closed: true` means the lot has settled: the number was MINTED to the winner in the
        closing transaction (D-90), the winner's 1 GRAM ran through the §4.1 split, and the
        premium above it went to the ratchet as `pending`.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  # Every number at or ahead of the head derives to an address with no item
                  # deployed at it yet. That is an answer, not a failure — see NotDeployed.
                  - $ref: "#/components/schemas/NotDeployed"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          found: { type: boolean }
                          p0Nanoton:
                            type: string
                            description: P0(n) — the opening bid this lot was opened at, not a ceiling.
                          highBidNanoton: { type: string }
                          highBidder: { type: string }
                          openedAt: { type: string, description: Unix seconds. }
                          closesAt:
                            type: string
                            description: >
                              Unix seconds, LIVE — includes every snipe extension applied so far.
                          minNextBidNanoton: { type: string }
                          closed: { type: boolean }
                      provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /trophy/floor/{n}:
    get:
      tags: [trophy]
      summary: The floor a lot for n cannot close below (GAUNTLET.md C6.2c). 30s tier.
      description: >
        Backed by `getLotFloor(n)` on the trophy market. Returns `floorOf(cfg, mode, p0,
        priceFloor)` — the SAME pure function the contract itself settles a lot against
        (GAUNTLET.md C6.2/C6.2b, D-61 option 2), so this cannot disagree with a live lot by
        construction.

        `found: false` (with `floorNanoton: "0"`) means no lot exists yet for `n` — an
        ascending lane's floor is its own opening bid, which has no meaning before the lot
        opens.

        Slow tier, unlike `/trophy/lot/{n}`: the floor is fixed the instant a lot opens
        (mode/p0 never change afterward), so polling it fast would spend budget re-learning a
        number that cannot move — the same reasoning `/trophy/params` and
        `/trophy/score/{n}` already use.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  # Every number at or ahead of the head derives to an address with no item
                  # deployed at it yet. That is an answer, not a failure — see NotDeployed.
                  - $ref: "#/components/schemas/NotDeployed"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          found: { type: boolean }
                          floorNanoton: { type: string }
                      provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /trophy/score/{n}:
    get:
      tags: [trophy]
      summary: D(n), its category bitmask, and the sum line by line (D-99). 30s tier.
      description: >
        Backed by `getScoreBreakdown(n)` on the market. DECISIONS.md D-99 replaced the
        three rarity tiers with ONE additive score, so this route answers "which categories
        did `n` earn, and what did each contribute" rather than "which bucket is it in".

        `breakdown` is derived here by joining `flags` against `SCORE_BITS` in
        `shared/opcodes.ts` and the digits of `n`; the weights are the owner-declared table
        the contract compiled from, and `/trophy/params` serves the chain's own copy beside
        it so a drift between the two is visible. Sum every line's `points`, clamp at
        `scoreMax`, and you must land on `score` — that recompute is why the route exists
        (CONCEPT.md §9.1).

        A number's categories are a fact about the number, so for a given `n` this moves only
        at a redeploy — the same slow tier as `/trophy/params`.

        `?factored=1` serves the same shape from `getScoreBreakdownFrom(n, factors)` over
        `n`'s own factorization — the score `/trophy/price/{n}` quotes an open on (F65/F67).
        The plain read stays the from-`n` score, which is what the head-mint rebate pays on.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
        - name: factored
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  # Every number at or ahead of the head derives to an address with no item
                  # deployed at it yet. That is an answer, not a failure — see NotDeployed.
                  - $ref: "#/components/schemas/NotDeployed"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          score:
                            type: string
                            description: The CLAMPED sum — what actually prices the lot.
                          flags:
                            type: string
                            description: >
                              The uint48 category bitmask as a decimal string (JSON numbers
                              stop being exact at 2^53). NOT clamped, unlike `score`: a number
                              keeps every category it earned even where the clamp bought it no
                              more points.
                          breakdown:
                            type: array
                            description: >
                              Every set category plus the continuous LEN term, in bit order.
                              A line appears only where it contributed, so an empty array is
                              the honest rendering of a number that earned nothing. `Σ points`
                              can exceed `score` on a number that hit the clamp; that
                              difference IS the clamp and is meant to be seen.
                            items:
                              type: object
                              properties:
                                bit:
                                  type: integer
                                  description: >
                                    The permanent `SCORE_BITS` identifier; `-1` for LEN, which
                                    is continuous and therefore has no bit at all.
                                key: { type: string, example: mersenne }
                                group: { type: string, enum: [LEN, DIGIT, LIFE, FORM, CULTURE, POSITION] }
                                points:
                                  type: integer
                                  description: >
                                    What this line contributed, which is not always the table
                                    weight: bit 5 pays per trailing zero and LEN pays
                                    `lenW · (lenRef − digits)`.
                                note:
                                  type: string
                                  description: >
                                    Present only where the contribution needs arithmetic to be
                                    checkable — the LEN and per-trailing-zero lines.
                      provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /trophy/price/{n}:
    get:
      tags: [trophy]
      summary: P0(n), RES_GAS, the D-33 bid step, D(n) and the LANE, for any number. 30s tier.
      description: >
        Backed by `getLotPriceFrom(n, factors)` + `getLotLane(n)` on the market, with
        `getNpv(n)` and `getPrimeFloor(n)` folded in for a prime. A composite is quoted over
        its own factorization (the list `open_lot` must carry), so `p0Nanoton` is what opening
        charges, not the from-`n` lower bound `getLotPrice(n)`; a prime passes no list (F65). Under D-30 this is the ONLY quote there
        is, and it answers for every `n`.

        `lane` is D-88's rule, and it depends on primality AND on where the head is:

        * `0` — MODE_ASCENDING. ANY number the head has not reached, prime or composite.
          `open_lot` IS the first bid (you cannot open a lot you are unwilling to buy) and a
          7-day clock follows. What differs by class is the PROOF the open carries (`kind`:
          a factorization for a composite, nothing for a prime, which the contract checks by
          its own Miller-Rabin) and winning MINTS the number at close, for both kinds (D-90).
        * `2` — MODE_DUTCH_BUYNOW. A PRIME the head has already passed. `open_head_lot` is
          permissionless and gas-only, refused before the turn with 1024; the clock always
          runs from open. The price descends to `primeFloorNanoton` and then PARKS there
          until somebody buys it — no expiry, and D-88 deletes the sweep that used to delete
          such a lot.
        * `-1` — not openable at all: a §7 primorial, which mints at the head only, or a
          number above the cap. A UI disables the action with a reason instead of quoting a
          price that would be refused.

        **Lane 0 no longer implies "composite".** `primeFloorNanoton` is the field that says
        which class `n` is: the chain answers it for a prime and only for a prime, and the
        two flows above differ, so a caller must read it rather than infer the class from
        the lane. D-88 point 2 also deletes the two special modes (`3`, `4`) this route used
        to be able to return — there are exactly two lot modes, and under D-99 a memorable
        number is one on an ordinary lane whose score lifted its price. `/trophy/score/{n}`
        publishes that score line by line.

        These are deliberately the same integers `getLot(n).mode` reports, so the answer
        before a lot exists and the answer after it exists are the same number. The lane
        comes from the CONTRACT's own Miller-Rabin, never from a caller-supplied `kind`; it
        is also the number to check a client-side sieve against, Carmichael numbers
        included.

        `p0Nanoton` is what OPENING costs on the ascending lane — and opening is a payment,
        because it is the first bid — and the price a Dutch lot starts its descent from. It
        is the same figure on both, deliberately: a prime opened by auction the day before
        its turn opens at exactly the price its descent would have started from the day
        after (D-88 point 3). It is the exact figure the contract measures the message value
        against; add a fee margin on top, or a busy block rejects the nominal.

        `resGasNanoton` rides along because the two lanes spend it differently: it is INSIDE
        `p0` on the ascending lane (`p0 >= LOT_FLOOR = 1 GRAM + RES_GAS`) and added ON TOP of
        the standing price on the Dutch lane. Publishing it here makes that arithmetic
        checkable without a second read.

        `minIncrementNanoton` is D-33's bid step evaluated at `p0`: the second bid must clear
        `p0 + minIncrement`. Once a lot exists, `GET /trophy/lot/{n}`'s `minNextBidNanoton`
        is the live figure.

        `score` is published with the price so "why does 1000 open at 128 GRAM" is answerable
        without reading bytecode (§9.1). Cross-reference `/trophy/params`, which publishes
        the weight vector and the `2^(D/10)` fixed-point table the price is computed from.

        `npvNanoton` and `primeFloorNanoton` are fetched only for a PRIME — both branches
        exist only there, so a composite would pay two upstream calls to learn numbers that
        cannot affect its price. The gate is primality and not the lane, because a prime
        ahead of the head is on lane 0 and still has both. `"0"` for a prime's NPV is a real
        answer, not a gap: the dictionary is finite by construction and a miss means the
        score ladder alone governs — D-99 deletes `PRIME_P0_MIN`, so there is no flat prime
        floor left to fall back to — and it is exactly the case whose resting
        price falls back to the 1 GRAM clamp.

        **409 for `n` above `AUCTIONABLE_MAX`.** `getLotPrice` throws 1020 `mkt_n_above_cap`
        there, and the refusal is cached on the same 30s key as a quote — it is a stable
        fact about `n`, not a failure — so an out-of-range input costs the same bounded
        `1 call / TTL` as any other.

        30s tier: `P0(n)` is a pure function of `n` over compile-time constants and a
        deploy-fixed NPV dictionary that no message can change (there is no setter — that
        would be an owner who can reprice every prime lot, which the zero-admin-surface
        requirement exists to deny). For a given `n` the answer changes only at a redeploy.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      p0Nanoton: { type: string }
                      resGasNanoton:
                        type: string
                        description: >
                          Inside p0 on the ascending lane; added on top of the standing
                          price on the Dutch lane.
                      minIncrementNanoton:
                        type: string
                        description: D-33's bid step evaluated at p0.
                      score:
                        type: string
                        description: >
                          `D(n)` — the one additive score that prices every number (D-99),
                          clamped at `scoreMax`. `/trophy/score/{n}` breaks it into lines.
                      flags:
                        type: string
                        description: >
                          The uint48 category bitmask that produced `score`, as a decimal
                          string. Bit `b` is `SCORE_BITS[b]` in `shared/opcodes.ts`. NOT
                          clamped, unlike `score`.
                      lane:
                        type: integer
                        enum: [-1, 0, 2]
                        description: >
                          -1 = not openable (a §7 primorial, or above the cap);
                          0 = MODE_ASCENDING — ANY number ahead of the head, either class;
                          2 = MODE_DUTCH_BUYNOW — a PRIME the head has passed.
                          The same integers `getLot(n).mode` reports. Read
                          `primeFloorNanoton` for the class: lane 0 does not imply composite.
                      npvNanoton:
                        type: string
                        nullable: true
                        description: >
                          NPV(n) as the contract will actually price it. null for a
                          composite (the branch does not apply); "0" for a prime the table
                          does not carry.
                      primeFloorNanoton:
                        type: string
                        nullable: true
                        description: >
                          `getPrimeFloor(n)` — D-88 point 1: where this prime's descending
                          lot comes to REST and stays until somebody buys it,
                          max(NPV(n)/2, P0(n)/3, MINT_PRICE). D-99 deletes the tier lift that used to
                          raise it. null for a composite, which has no descending lane —
                          so this doubles as the primality bit the lane no longer carries.
                          Draw the descent down to THIS, not to
                          `/trophy/params`'s `primeDutch.floorNanoton`, which is the global
                          1 GRAM clamp and equals the resting price only for a prime the
                          finite NPV table misses.
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "409": { $ref: "#/components/responses/NAboveCap" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /trophy/params:
    get:
      tags: [trophy]
      summary: Every declared constant of the trophy lane (CONCEPT.md §4.4 point 1b). 30s tier.
      description: >
        Backed by `getMarketParams()` + `getFracTable()` + `getIncrementLadder()` +
        `getScoreWeights()` + `getMarketConfig()` + `getPrimeDutchTerms()` on the market,
        collapsed into ONE cache key.

        §9 calls the `params.json`-vs-contract comparison "what makes the whole proposal
        honest, because without it the ladder drifts out of the sim's control silently".
        This route is where a reader performs that comparison without running a node.

        `SCORE_HALVING`, `SCORE_MAX`, `AUCTION_WINDOW` and `BID_EXTENSION` are DECLARED
        in `params.json`'s exact sense — a stated constraint, owned by the owner, not a
        simulation output, and §6 is explicit that this document will not dress them as
        such. `bidExtensionSeconds` is 4020: 67 minutes, and 67 is prime, deliberately.

        D-30 DELETES `dMin` — the WORTH gate — from this response, because it deletes the
        constant from the contract: every composite is worth an auction now, so a score gate
        would be a refusal to sell rather than a redirect. Nothing is substituted for it.

        `minAuctionDistance` IS DELETED, by D-45 — a different decision than D-30's, and
        later. It used to be a LIVENESS gate: an ascending lot's 7-day window had to finish
        before the sequential head arrived at `n` and truncated it, so `open_lot` threw 1007
        unless `n > headHint + minAuctionDistance`. D-45 deletes the truncation instead of
        widening the margin against it: the ledger now takes an opened composite off its
        sequential line the moment `open_lot` runs (permanently — see `mark_off_head` in the
        ledger's schema), so the head can never again reach, and therefore never truncate, an
        open lot's window, at any distance. A lot may now open immediately next to the head.
        This field is removed from the response rather than zeroed, so a client cannot
        mistake "no gate" for "gate at distance 0".

        `lotFloorNanoton` (was `reserveFloorNanoton`) is an IDENTITY, not an independent
        constant: `MINT_PRICE + RES_GAS`, i.e. **1.06 GRAM** — D-30 removes the
        `RES_PRIORITY_BASE` term of the old 1.05, and W8.1 re-derived `RES_GAS` to 0.06.
        Writing it as a sum is what makes the floor a checked equality rather than a
        coincidence that drifts the next time `RES_GAS` is re-measured — cross-check it
        against `/lots/fee-split`.

        `incrementLadder` is D-33's bid-increment ladder, `getIncrementLadder()`: 13
        basis-point rungs indexed by the band `D(n) / scoreHalving` (0..12), then the shared
        nanoton floor and the basis-point denominator. The contract's rule verbatim is
        `min_increment = max(minIncrementFloor, high · bps[D / scoreHalving] / bpsDen)`, so
        §9.1 holds for the bid step the way `fracTable` makes it hold for `P0`: the minimum
        raise on any lot is recomputable off chain from `n` alone. The flat `minIncrementPct`
        is DELETED — the ladder replaced it, and there is no percentage left to publish.

        `fracTable` is `round(2^(j/10) · 2^16)` for j = 0..9 with `fracShift = 16`, published
        rather than merely commented because §9 names the integer approximation as the
        likeliest place for silent contract/sim drift.

        `peers` are the two genesis-fixed destinations: the ledger (the premium's first
        hop) and the ratchet the ledger forwards it to. Published so the
        zero-admin-surface claim is checkable from outside: these are the only addresses
        value can reach from the market, no message changes any of them, and there is no
        owner field, no reprice and no withdraw path.

        30s tier, and it would be slower if there were a slower tier: nothing here can change
        without a redeploy.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scoreHalving: { type: string, description: P0 doubles every this many points of D(n). }
                      scoreMaxPoints:
                        type: string
                        description: >
                          SCORE_MAX — 87, the ONE clamp on the score (D-99). `2^(87/10) =
                          420.4`, so this figure IS the 420 GRAM ceiling on an opening price.
                          It occupies the tuple position `PRIME_P0_MIN` held before D-99
                          deleted that constant outright: there is no flat "a prime opens at
                          >= 5 GRAM" floor any more, because one additive score prices every
                          number and a prime that earns nothing opens like anything else.
                      primeP0MultiplePct:
                        type: string
                        description: Integer percent (150 = 1.5×), inherited from §6.
                      lotFloorNanoton:
                        type: string
                        description: >
                          LOT_FLOOR — an identity, MINT_PRICE + RES_GAS (1.06 GRAM). D-30
                          drops the RES_PRIORITY_BASE term; W8.1 re-derived RES_GAS to 0.06.
                      auctionWindowSeconds: { type: string, description: D4 — 604800 (7 days). }
                      bidExtensionSeconds: { type: string, description: D10 — 4020 (67 minutes, prime). }
                      minIncrementFloorNanoton:
                        type: string
                        description: >
                          MIN_INCREMENT_FLOOR — 0.015 GRAM, the same value `incrementLadder`
                          publishes. It replaced the flat 1 GRAM floor, which was defensible
                          only while D_MIN kept the cheapest lot at 8 GRAM.
                      fracTable:
                        type: array
                        items: { type: string }
                      fracShift: { type: string }
                      incrementLadder:
                        type: object
                        description: >
                          D-33's bid-increment ladder. min_increment = max(floor, high ·
                          bps[D / scoreHalving] / bpsDen).
                        properties:
                          bps:
                            type: array
                            items: { type: string }
                            description: 13 rungs, indexed by the band D(n) / scoreHalving (0..12).
                          minIncrementFloorNanoton: { type: string }
                          bpsDen: { type: string }
                      scoreWeights: { $ref: "#/components/schemas/ScoreWeights" }
                      peers:
                        type: object
                        properties:
                          ledger: { type: string }
                          ratchet: { type: string }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /vault:
    get:
      tags: [audit]
      summary: Bounty vault configuration (CONCEPT.md §3.3). 30s tier.
      description: Backed by `getVaultConfig` on the bounty vault contract.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ledger: { type: string }
                      jettonMaster: { type: string }
                      jettonWallet: { type: string }
                      walletSet: { type: boolean }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /vault/rebate/{kind}/{n}:
    get:
      tags: [audit]
      summary: Rebate schedule and paid status for a rebate kind + n (D-99). 5s tier.
      description: >
        Backed by `getRebateSchedule(kind, n)` on the bounty vault (PRICING_MODEL_PLAN.md
        §1.5). There are exactly TWO kinds and they are populations, not rarities: `0` a
        composite minted AT THE HEAD, paid PER POINT of its score, and `1` a prime of the
        rebate family (`p > 100,000`, `p ≡ 1 mod 101`), paid flat by any route. An
        auction-won composite is paid nothing — the premium is the price of impatience.

        On kind `0` the two amounts are per point, so multiply them by `score` from
        `GET /trophy/score/{n}`; the multiplication is left to the reader precisely so it is
        one they can check (CONCEPT.md §9.1).

        `scheduled: false` means the vault's genesis-fixed `rebateSchedule` has no entry for
        that kind at all — a capability gap, not a claim status. `paid` flips permanently
        once `n`'s rebate has been sent (the vault's `paidSpecials` idempotency map), so a UI
        can distinguish "still claimable" from "already collected" without racing the claim
        transaction.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: integer, enum: [0, 1] }
          description: 0 = composite at the head (per point), 1 = prime rebate family (flat).
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scheduled: { type: boolean }
                      bountyTonNanoton:
                        type: string
                        description: Per POINT on kind 0; flat on kind 1.
                      maxPrimesNanoton:
                        type: string
                        description: The `min(bountyTon · S/T, maxPrimes)` clamp ceiling. Per point on kind 0.
                      paid: { type: boolean }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /vault/era/{n}:
    get:
      tags: [audit]
      summary: The era ceremony's bounty for a primorial boundary (CONCEPT.md §7). 30s tier.
      description: >
        Backed by `getEraSchedule(n)` on the bounty vault. Whoever mints one of §7's eight
        boundaries takes the whole era bounty — the largest payout the vault makes to a
        minter, three orders of magnitude above §9.6's score rebate (0.000213 GRAM per point
        of `D(n)`, against 0.21 GRAM flat at the first boundary) and the only one attached to
        a particular number rather than to a score. It is budgeted from the genesis bounty
        vault (§3.3), so it is pre-counted in `S` and touches neither the split nor the
        ratchet.

        GRAM-denominated (DENOMINATION_PLAN P4 / D22). The vault pays
        `min(bountyTon · S/T, maxPrimes)` nano-PRIMES, where `S` and `T` are
        `GET /ledger/floor`'s two terms. The multiplication is left to the reader on purpose
        (CONCEPT.md §9.1), the same split `/vault/rebate/{kind}/{n}` makes for the score.

        `scheduled: false` is every `n` that is not one of the eight boundaries. `paid` flips
        permanently when the ceremony fires.
      parameters:
        - $ref: "#/components/parameters/NumberPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scheduled: { type: boolean }
                      bountyTonNanoton:
                        type: string
                        description: The ceremony's fixed VALUE in nanoGRAM.
                      maxPrimesNanoton:
                        type: string
                        description: The nominal PRIMES ceiling the payout is clamped to.
                      paid: { type: boolean }
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /vault/program/{tag}:
    get:
      tags: [audit]
      summary: One bounty-vault allow-list entry — D-170's bug-bounty prize is SECU's remaining. 30s tier.
      description: >
        Backed by `getProgram(tag)` on the bounty vault (DECISIONS.md D-170 point 4,
        GAUNTLET.md F79). The allow-list is genesis-fixed; each entry names a program
        contract and the PRIMES it may still spend. `/verify` publishes the bug-bounty prize
        as the `SECU` entry's `remainingNanoprimes` (CONCEPT.md §9.1). `tag` is a decimal
        uint32 and must be one of the three genesis tags (QSTS, SECU, PQST).
      parameters:
        - name: tag
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]+$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      found: { type: boolean }
                      addrHash:
                        type: string
                        description: The program contract's basechain address hash, hex.
                      remainingNanoprimes:
                        type: string
                        description: nanoPRIMES the program may still spend.
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "400":
          description: Not a decimal integer, or not one of the four genesis program tags.
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  # ---------------------------------------------------------------------------
  # event-poller-backed (served by a different service, listed for completeness)
  # ---------------------------------------------------------------------------

  /feed:
    get:
      tags: [events]
      summary: Recent mint feed (event-poller-backed — NOT a get-method call).
      description: >
        Served by the event-poller service (backend/event-poller), not read-proxy itself —
        listed here for API-surface completeness since FRONTEND_PLAN.md treats it as part of
        the same "live stats" surface. This endpoint is indexed-event-backed, not a live
        get-method read, so it intentionally carries NO `provenance` field in the get-method
        sense — its honesty framing is "recomputable from indexed on-chain events," a
        different (weaker) claim than a direct get-method call, and is documented as such
        rather than given a misleading provenance object.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mints:
                    type: array
                    items:
                      type: object
                  events:
                    description: >
                      The same window, widened past mints: one row per indexed event, newest
                      first, each carrying `kind` (`mint` | `flush` | `claim`), `ts`, and the
                      fields that kind has, including the `tx_hash` of the transaction that
                      produced it so a client can link the row to an explorer.
                      `first_for_actor` marks a wallet's first indexed mint — a display flag over indexed history, nothing is paid on it. Pool
                      swaps are absent on purpose: nothing here observes DeDust, and the flush
                      trigger does not carry the swapped amount.
                    type: array
                    items:
                      type: object

  /leaderboard/tribute:
    get:
      tags: [events]
      summary: Tribute leaderboard (event-poller-backed — see /feed's provenance note).
      description: >
        `around` is **D-124's band**: given a wallet, the route answers the contiguous run of
        rows centred on it (four above, five below) with the board's own leader prepended
        when rank 1 falls outside that run — so a reader outside the top ten sees the rows
        they can actually pass. The leader is kept because the client draws every bar against
        the maximum of what was served. A wallet that has claimed nothing has no seat here
        and the top-N is served instead, never a fabricated rank. Every row carries its true
        `rank` either way.
      parameters:
        - name: around
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: Wallet to centre the board on. Omit for the top-N; over 128 characters is a 400.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items:
                      type: object
                      properties:
                        owner: { type: string }
                        total: { type: string }
                        rank:
                          type: integer
                          description: True position on the whole board, not the index in what was served.

  /number/{n}/referrals:
    get:
      tags: [events]
      summary: Paid referral count for one referral key (event-poller-backed — see /feed's provenance note).
      description: >
        Mints that quoted `n` as their referral key AND that the ledger actually paid
        (`primes_ledger.tolk` referralValid: key >= 2, sold before the quoting mint, and
        never taken off-head by a lot). Same predicate as the read-index's /boards/referrals.
      parameters:
        - in: path
          name: n
          required: true
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  referralKey: { type: integer }
                  mintCount: { type: string }
        "400":
          description: n is not a decimal integer that fits 32 bits.

  /wallets/{address}/earn-facts:
    get:
      tags: [events]
      summary: Everything /earn needs from the EVENT index, for one wallet and its key (event-poller-backed — see /feed's provenance note).
      description: >
        GAUNTLET.md J8 / F50. The funnel's two PROVED tiles and six of the sixteen quest
        numerators are facts about TRANSACTIONS, not about current state, so no get-method
        answers them: "how many mints cited your key and the ledger paid" is a scan of
        `mints`, not a selector on the ledger. Both halves were previously rendered from a
        zero — the funnel from an `attributed_mints` table whose only writer was a route
        nothing ever called, the quests from a literal `0` in the webapp's request body.
        `mintCount`/`giftMints` key off `mints.payer` (who PAID), never `mints.owner`
        (which is the gift's recipient); `lotsOpened` counts lots this wallet OPENED, on
        either lane. The `referral` block is present only when `key` is supplied, and its
        three counts are three different questions: wallets that cited the key at all, PAID
        citations, and distinct wallets among those.
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
        - in: query
          name: key
          required: false
          description: The sharer's referral key `rN`. Omit it and `referral` is null.
          schema: { type: integer, minimum: 0, maximum: 4294967295 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet: { type: string }
                  mintCount: { type: integer }
                  giftMints: { type: integer }
                  tributeClaims: { type: integer }
                  lotsOpened: { type: integer }
                  paidReferralMints:
                    type: integer
                    description: Mints this wallet PAID for whose referral line the ledger paid — the §9.4 social quests' mint gate (GAUNTLET.md J9). Needs no key.
                  ownedKeyPaidMints:
                    type: integer
                    description: Paid referral mints citing a number this wallet owns now (`number_owners`) — the story quest's mint gate at key granularity (DECISIONS.md D-160). Needs no key.
                  referral:
                    nullable: true
                    type: object
                    properties:
                      referralKey: { type: integer }
                      distinctMinters: { type: integer }
                      paidMints: { type: integer }
                      distinctPaidMinters: { type: integer }
        "400":
          description: key is not a decimal integer that fits 32 bits.

  /attrition:
    get:
      tags: [events]
      summary: >
        Claimable-state decay — how much of the collection has drifted into dead hands
        (CONCEPT.md §12; event-poller-backed, see /feed's provenance note).
      description: >
        CONCEPT.md §12's "Claimable state decays irreversibly" bullet, made measurable.
        A prime whose owner has lost their key keeps accruing tribute into `owed` and its
        share of `div_acc` forever and nothing can ever move it — `claim_tribute` is
        owner-gated and there is no admin path (§8) — so every such loss is a one-way
        transition and the claimable share of accrued value is monotone non-increasing.


        COUNTS ONLY. The GRAM amounts these counts refer to live on the contracts and must
        be read from there: `get_owed` on the item for the divisor line, and
        `getClaimableDividend(p)` on the ledger for the flat dividend not yet converted
        (§9.1). Joining the two is the dashboard's job; this endpoint deliberately does not
        assert a GRAM figure it cannot verify.


        `dormancyDays` is a REPORTING WINDOW and nothing more. Nothing expires, nothing is
        reclaimed, and no contract behaviour keys off it — changing it changes the answer,
        never the state.
      parameters:
        - in: query
          name: dormancyDays
          required: false
          schema: { type: number, default: 90, exclusiveMinimum: 0 }
          description: Days since a prime's last claim (or its mint, if never claimed) before it counts as dormant.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  dormancyDays: { type: number }
                  primesMinted: { type: integer }
                  neverClaimed:
                    type: integer
                    description: Minted primes with no claim event at all, at any age.
                  dormant:
                    type: integer
                    description: Minted primes whose last claim (or mint, if never claimed) predates the window.
                  active: { type: integer }
                  dormantShare:
                    type: [number, "null"]
                    description: >
                      null when nothing has been minted. "No primes yet" and "no primes are
                      dormant" are different statements and rendering the first as 0% is a lie.
                  neverClaimedShare: { type: [number, "null"] }
                  oldestDormantSince: { type: [string, "null"], format: date-time }
                  dormantPrimes:
                    type: array
                    items:
                      type: object
                      properties:
                        prime: { type: string }
                        owner: { type: [string, "null"] }
                        lastClaimAt: { type: [string, "null"], format: date-time }
                        mintedAt: { type: string, format: date-time }
                  source:
                    type: object
                    description: Where each half of the metric comes from, per §9.1.
        "400":
          description: dormancyDays was not a positive number of days.

  /portfolio/{address}:
    get:
      tags: [events]
      summary: Numbers attributed to one wallet, with their tribute history (event-poller-backed — see /feed's provenance note).
      description: >
        Mint-time attribution (the gift beneficiary, else the payer) unioned with the
        wallet's current holdings from an NFT holder index when one is configured
        (`attribution` says which). Transfers are not indexed, so a number sold on since its
        mint is still listed. NOT authority: confirm every row against the item's
        `getNumberData()` owner (read-proxy `POST /numbers`) before calling it owned. GRAM
        balances live on chain — `item.get_owed(p)` and `ledger.getClaimableDividend(p)`.
      parameters:
        - { name: address, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { type: string }
                  attribution: { type: string, enum: ["mint-time", "mint-time+holder-index"] }
                  numbers:
                    type: array
                    items:
                      type: object
                      properties:
                        number: { type: string }
                        isPrime: { type: boolean }
                        factors: {}
                        mintedAt: { type: string, format: date-time }
                        txHash: { type: string }
                        viaAuction: { type: boolean, description: Won at auction ahead of the head (D-90). }
                        gifted: { type: boolean }
                        creditCount: { type: integer }
                        creditedNanoton: { type: string, description: Replayed from mint bodies — not a get-method reading. }
                        claimedNanoton: { type: string }
                        lastClaimAt: { type: [string, "null"], format: date-time }
                  source:
                    type: object
                    description: derivedFrom, note and tonAmountsLiveElsewhere, per §9.1.

  /primes/{p}/ledger:
    get:
      tags: [events]
      summary: One prime's tribute credit-and-claim history (event-poller-backed — see /feed's provenance note).
      description: >
        Newest first. A `claim` row's amount is read off a real `claim_tribute` body and is
        chain truth; a `credit` row's `shareNanoton` is replayed arithmetic over the mint
        body that no get-method returns. `reconciliation.impliedOutstandingNanoton` may
        legitimately EXCEED the item's `getOwed(p)` (a forfeited unsold lot's share, or a
        bounced `credit_tribute` parked in `unrouted_credits`), never fall below it.
        `getOwed(p)` is the authoritative balance.
      parameters:
        - { name: p, in: path, required: true, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  prime: { type: string }
                  truncated: { type: boolean }
                  lines:
                    type: array
                    items:
                      type: object
                      description: >
                        `kind: credit` carries number, exponent, s, sumWeights, shareNanoton;
                        `kind: claim` carries amountNanoton and owner. Both carry txHash and ts.
                      properties:
                        kind: { type: string, enum: [credit, claim] }
                        number: { type: string }
                        exponent: { type: integer }
                        s: { type: string }
                        sumWeights: { type: string }
                        shareNanoton: { type: string }
                        amountNanoton: { type: string }
                        owner: { type: string }
                        txHash: { type: string }
                        ts: { type: string, format: date-time }
                  reconciliation:
                    type: object
                    properties:
                      creditCount: { type: integer }
                      grossCreditedNanoton: { type: string }
                      settledNanoton: { type: string }
                      impliedOutstandingNanoton: { type: string }
                      note: { type: string }
        "400":
          description: p is not a decimal integer, or limit is out of range.

  /lots/won:
    get:
      tags: [events]
      summary: Numbers won at auction ahead of the head (event-poller-backed — see /feed's provenance note).
      description: >
        One row per closed ascending lot with a winner, written at the lot's close. Since
        D-90 the close IS the mint, so every row is `settled` and the route takes no
        filter. Ownership is the item's `getNumberData()`, not this list.
      responses:
        "200":
          description: Raw `won_lots` rows, ascending by number.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    number: { type: string }
                    state: { type: string, enum: [settled] }
                    winner: { type: [string, "null"] }
                    beneficiary: { type: [string, "null"] }
                    referral_key: { type: integer }
                    won_tx: { type: [string, "null"] }
                    won_at: { type: [string, "null"], format: date-time }
                    resolved_tx: { type: [string, "null"] }
                    resolved_at: { type: [string, "null"], format: date-time }

  /collections:
    get:
      summary: The issued collection, as a card (webapp /trade)
      description: >
        The numbers collection in one read: what each is, how many
        items exist, and how it is doing on the secondary market.


        TWO KINDS OF NUMBER, AND THE RESPONSE SAYS WHICH IS WHICH. `issued` is a get-method
        return and carries a normal `Provenance` naming it. The numbers card reads `getLaunch().itemsMinted` on the LEDGER, not the
        collection's own `next_item_index`: D-20 makes `next_item_index` the ledger's HEAD,
        which walks composites only and therefore runs ahead of the true item count by π(n)
        and further for every number an auction minted off-head.


        `market` is NOT a get-method value and never can be — no contract in this system
        records what its items sold for on a third-party venue. Volume, floor, the live
        listing count and the trade count are computed DAILY from the free GRAM data lake's
        `nft_events` (`tools/lake/market.sql`, DECISIONS.md D-201) — EVERY TON marketplace, not one venue's view of
        its own order book — and ride `MarketplaceProvenance` (`source: "marketplace"`), a
        distinct type so a client cannot render them in a proof drawer beside a get-method
        citation. §9.1 is satisfied by stating the source, not by pretending the number is
        chain state.


        Volume is SECONDARY ONLY and GRAM-denominated. A venue's headline "total volume" blends
        its own primary mint revenue in; this game's primary sales are the 1 GRAM mints
        `issued` already reports from a get-method, so blending would double-count. Amounts
        are NANOTONS as decimal strings, because they are magnitudes a float would round.


        A CARD DEGRADES ALONE. An unconfigured role, an undeployed collection, or an
        unmounted market file sets that card's `issuedUnavailable` / `marketUnavailable` reason;
        the other cards answer normally and the route does not 503. Every deployment is in
        that state until the genesis that deploys all three.


        A COLLECTION THAT HAS NEVER TRADED IS NOT AN ABSENCE: it returns `market` present with
        every figure zero and `floorNanoton` null. "Nothing has sold yet" and "we could not
        find out" are different answers and this route does not collapse them. The market read
        NEVER BLOCKS: it serves the last computed rows and fires a refresh behind them, so a
        request never waits on a ~16s query execution.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      collections:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              enum: [numbers]
                            address:
                              type: string
                              nullable: true
                              description: The collection contract; null when the role is unconfigured.
                            handle:
                              type: string
                              description: >
                                GetGems short-link slug (mainnet only). The client builds the
                                URL, falling back to the /collection/{address} form on testnet.
                            issued:
                              type: string
                              nullable: true
                              description: >
                                Items in existence, from the get-method named in
                                `issuedProvenance`. Null is "unknown", never zero.
                            issuedProvenance:
                              type: object
                              nullable: true
                            issuedUnavailable:
                              type: string
                              nullable: true
                            market:
                              type: object
                              nullable: true
                              description: >
                                Marketplace-index figures across every TON marketplace. NOT
                                chain state, and never rendered as though they were.
                              properties:
                                volumeNanoton:
                                  type: string
                                  description: >
                                    All-time realised, GRAM-denominated, SECONDARY only.
                                    Nanotons as a decimal string.
                                trades:
                                  type: integer
                                  description: >
                                    Sales behind `volumeNanoton`. A volume with no trade count
                                    cannot be read.
                                floorNanoton:
                                  type: string
                                  nullable: true
                                  description: >
                                    Lowest FIXED-PRICE ask among items listed right now, in
                                    nanotons. Null means nothing is listed, which is an
                                    answer. Auction reserves are excluded — a reserve is not a
                                    price anyone can pay.
                                onSale:
                                  type: integer
                                  description: Items on sale right now, fixed-price and auction.
                                lastSaleAt:
                                  type: integer
                                  nullable: true
                                  description: Epoch ms of the most recent sale.
                            marketProvenance:
                              type: object
                              nullable: true
                              description: >
                                MarketplaceProvenance — `source: "marketplace"`,
                                `venue: "ton-data-lake"`, `endpoint` the dataset's AWS
                                registry page, `fetchedAt` when the daily job wrote the figures.
                            marketUnavailable:
                              type: string
                              nullable: true
                              description: >
                                `not-configured` = no market file mounted on this deployment;
                                `not-computed-yet` = the daily job has not computed these
                                addresses yet;
                                `unavailable` = the market file could not be read;
                                `not-indexed` = the lake does not cover this network (testnet).
                              enum: [not-configured, not-computed-yet, unavailable, not-indexed]
        "429": { $ref: "#/components/responses/RateLimited" }
