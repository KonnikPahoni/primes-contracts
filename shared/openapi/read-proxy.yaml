      description: >
        Backed by `getKMax`. Moved to the 30s TTL tier by UPGRADE_PLAN_V5.md §5 C3.2 — it
        moves only as n advances, so a 5s key bought nothing and cost 0.2 req/s.
      parameters:
        - name: n
          in: query
