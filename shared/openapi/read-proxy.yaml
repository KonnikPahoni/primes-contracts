openapi: 3.0.3
info:
  title: TON PRIMES read-proxy API
  version: 0.3.0
  description: >
    Fastify caching proxy over the TON PRIMES contracts' get-methods
    (IMPLEMENTATION_PLAN.md §2.2 item 1). Every stats endpoint carries a `provenance` field
    naming the exact get-method and contract address the data came from — CONCEPT.md §9.1's
    honesty constraint: "every number the UI shows must map to a public get-method ... and
    the UI links each stat to its source call." This is what FRONTEND_PLAN.md's proof-link
    drawer renders. Consumed by the Mini App/webapp (see FRONTEND_PLAN.md) and the landing
    page.

    ## 0.3.0 — the `/bank/*` namespace is gone (CONCEPT.md §3.4)

    CONCEPT.md §3.4 drops the "bank" vocabulary: there is no bank, there is a **ledger**
    (`T`, `S`, `div_acc`, the head, the six-line split) and a **ratchet** (`pending`,
    `flush()`, the DeDust leg). The `/bank/*` deprecated aliases shipped in 0.2.0 have been
    removed outright; the routes are `/ledger/*` and `/ratchet/*`.

    ## Failure modes, and what each one means

    - **429 + `Retry-After`** — the upstream RPC provider is rate-limiting this proxy. Not a
      server error, and previously (wrongly) reported as a 500. Back off and retry; the proxy
      also serves the last good value stale-while-revalidate wherever it has one, so a 429
      means it had nothing cached at all.
    - **503** — the relevant contract address env var is not configured.

    ## Provenance and freshness

    `provenance.source` is `live`, `cached`, or `stale`. `stale` means the revalidating chain
    read failed and this is the last good value; `provenance.fetchedAt` always states the
    true age, and the response also carries `Warning: 110`. The UI is expected to mark a
    stale stat visibly rather than present it as current.
servers:
  - url: http://localhost:4000
    description: Local / docker-compose default
  - url: https://primes.live/api
    description: Deployed

tags:
  - name: ledger
    description: Splitter + ledger contract — T, S, div_acc, head, k, k_max (CONCEPT.md §3.4).
  - name: ratchet
    description: Ratchet contract — pending, swapped, flush status (CONCEPT.md §4.3, §12).
  - name: numbers
  - name: assets
    description: >
      The asset side's cash position (CONCEPT.md §5.4). The only routes in this document
      that return a **derived** number rather than a projection of chain state: §9.1 permits
      a rate to be displayed if the derivation from get-methods is published next to it, so
      every response here carries its own inputs and arithmetic.
  - name: lots
    description: >
      The won-lot record and the fee that funds its settlement. Winning an ascending lot
      MINTS the number in the transaction that closes it (D-90): nothing is held, nothing
      waits for the head. Prices are quoted by `/trophy/price/{n}`.
  - name: registrars
  - name: trophy
    description: >
      THE MARKET's lot lanes (CONCEPT.md §4.4; DECISIONS.md D-3…D-8, D-30…D-33) — the ONE
      route to a number ahead of the head, and it depends only on primality. A composite is
      acquired by opening an ascending lot (opening IS a paid first bid; there is no score
      gate and no distance gate); a prime is bought on the descending Dutch lane, openable
      before its turn at a flat `P0(p)`, with the clock starting at the turn and terminating
      at exactly 1 GRAM. What is priced is **the right to buy**, not the number. The flat-fee
      reservation lane these routes used to sit beside is DELETED (D-30), so `/trophy/*` is
      now the whole acquisition read surface. Every lot here is bypassable by waiting, and
      that is the design, not a leak — the mint is 1 GRAM at the head, always.
  - name: treasury
    description: >
      DECISIONS.md D-100 / CONCEPT.md §5.5 — the GOVERNED TREASURY (`primes_treasury.tolk`),
      the LP MINER and its per-owner position children (`primes_lp_position.tolk`), and the
      LP SINK that holds locked depth (`primes_lp_sink.tolk`). The team's money under holder
      control; the game's economics stay under nobody's. Nothing in this group mints (TR-4),
      and nothing in it moves `T`, `S`, `pending`, `owed`, `k`, `K_CEIL` or the five-way
      split. **Locked depth is never summed into `T` or into the floor** (D-100 point 4): a
      pool's GRAM/PRIMES composition moves with every trade, so an LP-derived term would void
      §5's ratchet theorem. Two guarantees, two panels.
  - name: audit
  - name: events
    description: event-poller-backed, not get-method-backed — see /feed's provenance note.

components:
  schemas:
    Provenance:
      type: object
      description: >
        CONCEPT.md §9.1 honesty field. Present on every data-bearing response, at the top
        level or as an array on composite endpoints (GET /number/{n}, GET /solvency).
      required: [getMethod, contractAddress, source, fetchedAt]
      properties:
        getMethod:
          type: string
          description: >
            The exact get-method name(s) called, joined with "+" if more than one. Where a
            route is a projection of a composite read (e.g. /ledger/T over /ledger/floor)
            this names the specific get-method that produced the returned number, not the
            composite.
          example: getFloorNum+getFloorDen
        contractAddress:
          type: string
          description: The exact contract address the get-method was called against.
        source:
          type: string
          enum: [live, cached, stale]
          description: >
            "live" = fetched from the chain this request; "cached" = served from Redis within
            its TTL; "stale" = the revalidating read failed (upstream throttle) and this is
            the last good value, served past its TTL with its true `fetchedAt`. In all three
            cases `getMethod`/`contractAddress` name the real origin.
        fetchedAt:
          type: string
          format: date-time
          description: When the underlying chain read actually happened (not necessarily now).
    NotDeployed:
      type: object
      description: >
        The answer when a read resolves to an address with **no account behind it** — a `200`,
        not a `500`, and the same `{data: {found: false}}` shape `/trophy/lot/{n}` already
        returns for a number with no lot.

        On this protocol an uninit address is a normal, expected state rather than a fault: a
        number's NFT item is deployed by the message that first needs it
        (CONCEPT.md §3.1), so every number at or ahead of the mint head derives to
        a valid address with nothing deployed at it. The live providers report that as TVM
        `exit_code: -13`, which is NOT TVM's own 13 and is NOT the unknown-selector 11: 11 is a
        fact about the deployed bytecode, this is a fact about `n`. Any route that reads a per-number address can answer
        in this shape.

        The provenance envelope rides along, because §9.1 makes no exception for a negative
        answer: "there is no item here yet" was still read from the chain, and the reader is
        entitled to the get-method and the address it was read at.
      required: [data, code, reason, provenance]
      properties:
        data:
          type: object
          required: [found]
          properties:
            found:
              type: boolean
              enum: [false]
        code:
          type: string
          enum: [CONTRACT_NOT_DEPLOYED]
        reason:
          type: string
          description: Human-readable statement of which get-method could not run, and where.
        provenance: { $ref: "#/components/schemas/Provenance" }
    ConfigProvenance:
      type: object
      description: >
        The deliberate counterpart to Provenance, and a distinct schema rather than a fourth
        `source` value. Provenance asserts that a get-method was called and produced a number.
        Deployment addresses cannot assert that — they are the *input* to every such call.
        Serving them through the same shape would let configuration pass for chain-verified
        state, which is the confusion CONCEPT.md §9.1 exists to prevent.
      required: [source, configuredFrom, verifyWith, note, fetchedAt]
      properties:
        source:
          type: string
          enum: [config]
          description: Always "config". No chain read occurred.
        configuredFrom:
          type: object
          additionalProperties: { type: string }
          description: Env var or manifest key each address was read from.
        verifyWith:
          type: object
          additionalProperties: { type: string }
          description: >
            Per role, the get-method a reader may call to confirm the address independently.
            A pointer for the proof drawer — this service does not perform these reads.
        note: { type: string }
        fetchedAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error:
          type: string
    RateLimitedBody:
      type: object
      properties:
        error: { type: string }
        code: { type: string, enum: [UPSTREAM_RATE_LIMITED] }
        retryAfterSeconds: { type: integer }
    NAboveCapBody:
      type: object
      description: >
        DECISIONS.md D-11 / D-30 — `n` is above `AUCTIONABLE_MAX`, so no lot can be opened
        for it and `getLotPrice(n)` throws exit code 1020 (`mkt_n_above_cap`) rather than
        quoting. The guard runs BEFORE Miller-Rabin deliberately: an unguarded 78-digit
        argument overflows int257 inside `modpow` and surfaces as exit 4 instead of a
        refusal a UI can explain.

        Note what is NOT in this object: any field that could be read as a price. CONCEPT.md
        §9.1's rule is that a number nothing will sell is not quoted at zero as if it were
        free, and the contract's refusal to quote is only honest if the proxy does not
        invent the quote back. The number is still MINTABLE — at 1 GRAM, at the head, like
        every other number — it simply cannot be acquired ahead of the head.

        REPLACES `AuctionLaneOnlyBody` / exit 507. D-30 deletes the flat-fee lane, so there
        is no second venue to be redirected to and no number that is "for sale, but not
        here"; 506 and 507 are both retired and neither value is reused.
      properties:
        error: { type: string }
        code: { type: string, enum: [N_ABOVE_CAP] }
        exitCode: { type: integer, enum: [1020] }
        errorName: { type: string, enum: [mkt_n_above_cap] }
        seeOther:
          type: object
          properties:
            cap: { type: string, example: /trophy/params }
            head: { type: string, example: /ledger/head }
        provenance: { $ref: "#/components/schemas/Provenance" }
    ScoreWeights:
      type: object
      description: >
        D-99's weight table as `getScoreWeights()` publishes it (PRICING_MODEL_PLAN.md §1.3):
        33 per-bit weights in BIT ORDER, then the continuous LEN terms and the one clamp.
        The weights are OWNER-DECLARED, not sim-derived, and `shared/opcodes.ts` `SCORE_BITS`
        carries the same table off chain — publishing the chain's copy here is what makes
        "the two agree" a checkable assertion rather than a comment about a copy-paste.
      properties:
        bits:
          type: array
          description: >
            One row per category, in bit order. `bit` is a PERMANENT identifier: it keys the
            `flags` word, this table's position, and the orb's fixed satellite angle. `points`
            is the CHAIN's figure, never the local table's.
          items:
            type: object
            properties:
              bit: { type: integer }
              key: { type: string, example: mersenne }
              group: { type: string, enum: [DIGIT, LIFE, FORM, CULTURE, POSITION] }
              points: { type: string }
        lenRef:
          type: string
          description: LEN pays `lenW · (lenRef − digits)` while the number has fewer digits than this.
        lenW: { type: string }
        tzCap:
          type: string
          description: >
            Bit 5 (`trailing_zeros`) pays its weight PER trailing zero, counted no higher
            than this — the one bit whose contribution is not simply `points`.
        scoreMax:
          type: string
          description: >
            The ONE clamp on the sum. `2^(87/10) = 420.4`, so this figure IS the 420 GRAM
            ceiling on an opening price; no other ceiling exists.
    VestingLock:
      type: object
      description: >
        The treasury's instance of `primes_vesting.tolk`, as `getVesting` +
        `getVestingSchedule` report it: 1,000,000 PRIMES on a 4 x 25% / 270-day schedule
        (D-100 point 6). The only vesting lock since D-166 deleted the operator's.
      properties:
        contractAddress: { type: string }
        beneficiary: { type: string }
        startTime: { type: integer }
        totalAmountNanoprimes: { type: string }
        releasedAmountNanoprimes: { type: string }
        unlocked: { type: integer }
        tranches: { type: integer }
        nextUnlockAt: { type: integer }
        intervalSeconds: { type: integer }
        releasableNowNanoprimes: { type: string }
    YieldSample:
      type: object
      description: >
        One (head, owed) reading taken by this proxy. The *values* are chain state read
        through the get-methods named in `provenance`; the *pairing* — that these two numbers
        were read at the same moment — is the proxy's assertion, which is what makes the rate
        derived rather than proved (CONCEPT.md §9.1, §12).
      properties:
        head: { type: string, description: The ledger's head at the moment of the reading. }
        owedNanoton: { type: string, description: The item's accrued tribute/referral, nanoGRAM. }
        claimableDividendNanoton:
          type: string
          nullable: true
          description: '`div_acc − entry[p]`; null until the flat dividend get-method ships.'
        at: { type: string, format: date-time }

  headers:
    Warning:
      description: '`110` when the payload is stale.'
      schema: { type: string }
    Retry-After:
      description: Seconds to wait before retrying after an upstream throttle.
      schema: { type: integer }

  responses:
    NotConfigured:
      description: The relevant contract address env var is not set.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: >
        The upstream RPC provider is throttling this proxy and no cached value (fresh or
        within the stale grace window) was available to serve. Honour `Retry-After`.
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedBody"
    NAboveCap:
      description: >
        `n` is above `AUCTIONABLE_MAX`, so the market quotes no price for it. Explicitly NOT
        a 500, NOT a 404 (the route and the number are both real, and a get-method
        answered, decisively) and NOT a 200 carrying a null or a zero. 409 because the
        request is well-formed and the refusal is about the current state of `n`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NAboveCapBody"
  parameters:
    NumberPath:
      name: n
      in: path
      required: true
      schema: { type: string }
      description: Decimal string; may exceed 2^53.

paths:
  /health:
    get:
      summary: Liveness check, plus load telemetry (no chain data, no provenance).
      description: >
        `inflightUpstreamCalls` and `staleResponsesServed` are the rate-limit signals
        ops/rate-limit-budget.md's measured re-run reads.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  inflightUpstreamCalls: { type: integer }
                  staleResponsesServed: { type: integer }

  /contracts:
    get:
      summary: The deployment manifest — which address plays which CONCEPT.md §3.4 role.
      description: >
        Configuration, not chain state, and therefore carrying ConfigProvenance rather than
        Provenance. This is the address book every transaction-building client needs: without
        it the webapp had no source for the market address at all, and could only
        obtain the ledger address by mining it out of another route's chain-read receipt.
        Roles that this deployment has not configured are OMITTED, never null — a client must
        be able to fail loudly on a missing role rather than fall through to a wrong address.
        Makes no upstream call, so it has no 429.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: { type: string }
                    description: >
                      Role → address. **Sixteen roles**, and the list is enforced rather
                      than described: `backend/read-proxy/test/server.test.ts` reads
                      `ReadProxyAddresses`' fields out of the service's own source and fails
                      when this response omits one (`GAUNTLET.md` E18).

                      ledger, ratchet, registrar, market, jettonMaster, bountyVault,
                      venueTimelock, collection, stake, treasuryVesting, treasury,
                      lpSink, voucher,
                      securityVoucher (D-170), primeQuestsVoucher (G78 / D-171).
                  provenance: { $ref: "#/components/schemas/ConfigProvenance" }

  /nft/{file}:
    get:
      tags: [numbers]
      summary: TEP-64 item metadata and generated artwork for one number — json, lottie.json, tgs, png, gif, mp4.
      description: >
        The URL `primes_collection.tolk`'s `get_nft_content` composes for every minted number
        (`<commonContentPrefix><n>.json`), so this is what marketplaces, wallets and indexers
        resolve. Without it the items render blank however correct their on-chain data is.

        The `.json`, `.lottie.json` and `.tgs` forms make NO upstream call, and have no 429: TEP-64 item
        metadata carries name, description, image and attributes but not the owner — ownership
        is `get_nft_data` on the item, which a marketplace already reads — so every field there
        is a pure function of `n`. That is what makes an unbounded-cardinality route
        affordable; a crawler sweeping the whole collection costs CPU and costs the TonAPI
        budget nothing. It is also why the artwork is SEEDED from `n` rather than from
        mint-time chain entropy (CONCEPT.md §9.8): numbers mint exactly once and strictly in
        sequence, so `n` is already 1:1 with mints, and a stored seed would have to be read
        from the chain to serve the document.

        The RASTER forms (`.png`, `.gif`) are the exception, and a bounded one. Since
        ART_VERSION 2 the picture prints the number's mint date, which does not exist until the
        mint does, so those two make exactly one chain read per number — `getMintedDay()` on
        item(n) — cached for a year because a mint date is written once by the item's
        `Populate` handler and can never change. Once a number has been rendered it costs
        nothing again: the response carries `X-Primes-Art-Layer: final` for a minted number's
        permanent artwork and `base` for the dateless pre-mint layer, and the `Cache-Control`
        max-age follows that (a year for `final`, five minutes for `base`).

        WHAT TEP-64 ACTUALLY DEFINES: `uri`, `name`, `description`, `image`, `image_data` — and
        nothing for motion; its own text still lists standardising non-image content as an open
        question. `attributes`, `lottie`, `content_url`/`content_type` and `buttons` are all the
        de-facto Getgems extension. Consequently `image` must stand alone: a client that knows
        only TEP-64 sees the PNG, and the PNG is a finished picture rather than a poster frame.

        No provenance envelope, deliberately: this is a document defined by an external
        standard, and wrapping it would break every consumer that expects TEP-64 at this URL.
        Nothing varying with chain state may be added here — that belongs on /number/{n}.
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]+\\.(lottie\\.json|emoji\\.tgs|json|png|gif|mp4|tgs)$" }
          description: >
            `<n>.json` for metadata, `<n>.png` for the still, `<n>.lottie.json` for the vector
            animation, `<n>.tgs` for the same animation as a Telegram sticker, `<n>.emoji.tgs` for it as a
            round custom emoji with no square ground or brand mark (gzipped Lottie,
            512x512, loop capped at 3s), `<n>.gif` for the animation as a plain image file
            (every number — the fallback for the many surfaces that never play a Lottie),
            `<n>.mp4` for the video tier (primes only, and only where the host can render it).
      responses:
        "200":
          description: >
            TEP-64 metadata (application/json), the Lottie document (application/json), the
            Telegram sticker (application/x-tgsticker), the still (image/png), the animation
            (image/gif), or the video (video/mp4).
          content:
            application/json:
              schema:
                type: object
                required: [name, description, image, attributes]
                properties:
                  name: { type: string, example: "Prime 9973" }
                  description: { type: string }
                  image: { type: string, format: uri }
                  lottie:
                    type: string
                    format: uri
                    description: Getgems extension — the vector animation for this item.
                  tgs:
                    type: string
                    format: uri
                    description: >
                      Ours, not Getgems' — the same animation as a Telegram sticker. A client
                      that does not know the field ignores it; the surfaces that do are the
                      Mini App, the bot and every forward of a mint.
                  content_url:
                    type: string
                    format: uri
                    description: >
                      Getgems extension — the item's primary media. A composite always names
                      its GIF (`image/gif`, D-174). A prime names its mp4, and only when the
                      serving host can actually render it; advertising a URL that 404s would be
                      cached by a marketplace for an hour.
                  content_type: { type: string, example: "video/mp4", enum: ["video/mp4", "image/gif"] }
                  buttons:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        uri: { type: string, format: uri }
                  attributes:
                    type: array
                    items:
                      type: object
                      properties:
                        trait_type: { type: string }
                        value:
                          oneOf: [{ type: string }, { type: number }]
            image/png:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
        "400":
          description: Unrecognised suffix, or n outside the number line (n < 2, n > 2^256-1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >
            `<n>.mp4` for a composite (its animation is the Lottie document), or on a host with
            no video renderer configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /unfurl/{family}/{n}:
    get:
      tags: [numbers]
      summary: The title and description head tags of one number page, from its math alone.
      description: >
        SEO_PLAN 4.1. nginx SSI-includes this fragment into the raw `/n/<n>` and `/lot/<n>`
        documents, so a reader that runs no JavaScript (an unfurler, an AI crawler) sees
        `97 is prime · TON PRIMES` or `1001 = 7 × 11 × 13 · TON PRIMES`, the same title the
        app sets at runtime (`shared/numberMeta.ts` writes both). The tags are pure math:
        primality and factorization only, never owner or price. Nothing above the market's
        `AUCTIONABLE_MAX` (14 digits) is factored; it gets the generic copy. SEO_PLAN 4.2: an
        `n` whose item is not deployed (not minted) is prefixed with
        `<meta name="robots" content="noindex, follow" />`, from the item's `getNumberData`
        read under a 700 ms deadline; a read that fails or runs out omits it, so a minted page
        is never deindexed by a slow chain. `lot` makes no read (its template is always
        noindex). On any failure nginx keeps the generic tags already in the template.
      parameters:
        - name: family
          in: path
          required: true
          schema: { type: string, enum: [n, lot] }
        - name: n
          in: path
          required: true
          schema: { type: string, pattern: "^[1-9][0-9]{0,77}$" }
      responses:
        "200":
          description: Six head tags — title, description, og:title/description, twitter:title/description — after a robots noindex tag when n is not minted.
          content:
            text/html:
              schema: { type: string }
        "400":
          description: An unknown family, or n not a positive integer of at most 78 digits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: The inbound per-visitor rate limit (one key per number, like /nft/{file}).

  /ledger/counters:
    get:
      tags: [ledger]
      summary: T, S, div_acc and π(n) in ONE call — the composite the rate-limit budget is built on.
      description: >
        UPGRADE_PLAN_V5.md §5 C2/C3.1: one cache key for the whole counter block, on the slow
        tier (5 calls per 30s). T and S are also served every 5s from their own `ledger:floor`
        key (`/ledger/floor`, `/ledger/T`, `/ledger/S`), so the two T/S readings may differ by
        up to one slow-tier window; each carries its own `fetchedAt`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      floorNumNanoton: { type: string, description: "T, in nanoGRAM" }
                      floorDenPrimes: { type: string, description: "S, in smallest PRIMES unit" }
                      divAccNanoton:
                        type: string
                        description: CONCEPT.md §3.2's flat prime-dividend accumulator.
                      primeCount:
                        type: string
                        description: π(n) — primes minted so far (`getPrimesCount`).
                      maxSupplyPrimes:
                        type: string
                        description: D-156's `S_MAX` (`getMaxSupply`) — the ceiling `S` approaches and never reaches.
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /ledger/floor:
    get:
      tags: [ledger]
      summary: The internal floor price p_f = T/S (CONCEPT.md §5), as its raw numerator/denominator.
      description: Backed by `getFloorNum` (T) and `getFloorDen` (S), on the fast `ledger:floor` key.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      floorNumNanoton: { type: string }
                      floorDenPrimes: { type: string }
