      tags: [ledger]
      summary: k(t) at a given (n, t) — the rebate-share fixed-point curve (CONCEPT.md §5).
      description: >
        Backed by `getK`. NOTE for callers: each distinct `t` is its own cache key, so polling
        this with a `t` that advances every second makes the cache useless. Quantize `t` to
        the poll interval, or compute the curve client-side from `/ledger/kmax`.
      parameters:
