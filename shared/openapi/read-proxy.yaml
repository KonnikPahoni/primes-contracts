  /ledger/last-mint-time:
    get:
      tags: [ledger]
      summary: Unix seconds of the last settled mint — the origin of `t` for /ledger/k.
      description: >
        Backed by `getLastMintTime`. `getK` is a pure curve, so without this the *current*
        point on it cannot be reconstructed from chain state and the UI's live rebate clock
        would rest on an indexer's timestamp (CONCEPT.md §9.1, ceremony mode). `0` is the
        contract's cold-start sentinel — nothing has been minted yet — not a timestamp.
