  /launch:
    get:
      tags: [ledger]
      summary: Has the game started — the one-shot launch flag and the collection's item count.
      description: >
        Backed by `getLaunch` on the ledger (CONCEPT.md §6 point 0). `ignite` mints Unity
        (n = 1) to the founder and flips `launched`; until it does, every player-facing
        money path on chain refuses — `mint`, `mint_won_lot`, opening a
        trophy lot, and bidding on a genesis lot. A client that
        offers those controls while `launched` is false is offering transactions the
        contracts reject at the cost of the sender's gas.


        `itemsMinted` is `head − 2 + launched`, computed **on chain**. Unity is minted
        outside the sequential run and does not advance the head, so the item count and the
        head differ by exactly the flag; §9.1 requires the published count to be a
        get-method's answer rather than arithmetic performed in the client.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      launched: { type: boolean, description: "True once `ignite` has landed. One-way." }
                      itemsMinted:
                        type: string
                        description: "NFTs in the collection, Unity included. `head − 2 + launched`."
                      marketLaunched:
                        type: [boolean, "null"]
                        description: "DESIGN.md G34 — the MARKET's own `getLaunched()`, a separate flag from the ledger's. Every market entry point throws `mkt_not_launched` (1022) while false. Null = not read (no market address, or no account behind it)."
                      marketLaunchedProvenance:
                        oneOf:
                          - { $ref: "#/components/schemas/Provenance" }
                          - { type: "null" }
                        description: Names the MARKET address; the envelope's `provenance` names the ledger.
                  provenance: { $ref: "#/components/schemas/Provenance" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NotConfigured" }

