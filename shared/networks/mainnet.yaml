# TON PRIMES — mainnet deploy facts. Read by every deploy script run against mainnet
# (blueprint --mainnet, or any network that is not testnet), through shared/networkConfig.ts.
#
# Only NON-SECRET values fixed per network live here. Secrets stay in /.env. Per-genesis
# values (deploy subwallet id, proposer, DeDust pool and jetton vault) stay in /.env too:
# they change with every run and each has its own preflight assert.
#
# There is deliberately no test_overrides block: mainnet's rename fee (200), donation (200),
# seed, auction clock (7 days) and stake minimum (50) are shared/params.json's, and the
# loader refuses the block in this file. A null below is a value genesis still needs —
# deployGenesis refuses to run until it is filled in.

network: mainnet

# Forfeit remainder (42%) and TEP-66 royalty destination. Permanent deploy data, no setter.
# Owner-signed in DECISIONS.md (D-209 amendment, 2026-11-21).
operator_addr: UQA6VjkuaK3eQJMvgA7BSnYXywuwGfpP1W5_N6iJdNzOYU_c

# DeDust's native GRAM vault on mainnet (same hash as testnet, different checksum).
dedust_native_vault: EQDa4VOnTYlLvDJ0gZjNYm5PXfSmmtL6Vs6A_CZEtXCNICq_

# D-212 first-naming fee in GRAM: 50 EUR at the GRAM/EUR rate ON GENESIS DAY, rounded to
# 0.1 GRAM (launch gate M5). Deploy data with no setter. Set it on the day, commit, deploy.
name_fee_ton: null

presentation:
  collection_metadata_uri: https://primes.live/collection.json
  # Trailing slash is load-bearing: the collection appends `<n>.json` with no separator.
  nft_content_prefix: https://primes.live/nft/
  jetton_metadata_uri: https://primes.live/jetton.json

