# TON PRIMES — testnet deploy facts. Read by every deploy and harness script run against
# testnet (blueprint --testnet, --skew-safe, contracts/scripts/testnet/*), and by the keeper
# when TON_NETWORK=testnet, through shared/networkConfig.ts.
#
# Only NON-SECRET values fixed per network live here. Secrets stay in /.env. Per-genesis
# values (deploy subwallet id, proposer, DeDust pool and jetton vault, LP stand-in) stay in
# /.env too: they change with every run and each has its own preflight assert.

network: testnet

# The owner's .owner.json key as v4R2 (TESTNET_MASTER_PLAN.md §4b; genesisPrep checks it).
operator_addr: kQAhPdCL9V9m2ZXJXTig4smnDrOwoMBjga92XJQERr1A76Of

# DeDust's native GRAM vault on testnet.
dedust_native_vault: kQDa4VOnTYlLvDJ0gZjNYm5PXfSmmtL6Vs6A_CZEtXCNIJE1

# D-212 first-naming fee in GRAM. Any small figure, so a rehearsal can afford a naming.
name_fee_ton: 0.5

presentation:
  collection_metadata_uri: https://primes.live/collection.json
  # Trailing slash is load-bearing: the collection appends `<n>.json` with no separator.
  nft_content_prefix: https://primes.live/nft/
  jetton_metadata_uri: https://primes.live/jetton.json

# No staking_venue: testnet genesis deploys the mock Tonstakers pool (D-151) and the loader
# refuses the block here.

# Testnet-only reductions of shared/params.json figures, so a full genesis and walkthrough
# fit a testnet budget. The loader refuses this block in mainnet.yaml. Remove a line to get
# the spec figure. Nothing measured on a set deployed with these is evidence about mainnet
# economics.
test_overrides:
  rename_fee_ton: 2        # spec 200 (params naming.rename_fee_ton)
  donate_ton: 50           # spec 200 (params genesis.genesis_donation_ton); donateFloor default
  auction_seconds: 3600    # spec 604800 = divisor 1; 3600 = divisor 168 (D-139 test clock)
  stake_min_ton: 3         # spec 50 (params staked_reserve.stake_min_ton); D-153 test stake floor
