[pytest]
testpaths = tests
; Make `primes_sim` importable regardless of how pytest is invoked. The console
; script (`pytest`, what `pnpm test:sim` runs) does NOT put the cwd on sys.path
; the way `python -m pytest` does, so without this the first test modules
; collected fail to import until test_determinations.py's own sys.path patch
; happens to run — an ordering accident, not a working configuration.
pythonpath = .
